# cargo-deny: cadeia de suprimentos do ISPer — vulnerabilidades conhecidas,
# licenças permitidas, versões duplicadas e origens das dependências.
# Roda no CI (job "deny") e localmente com `cargo deny check`.

[graph]
# O ISPer é Windows-only: avaliar o grafo de dependências deste alvo evita
# alarmes de crates que só entram em Linux/macOS.
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Vulnerabilidades: erro (padrão da versão 2).
# Crates sem manutenção: erro só quando são dependência DIRETA de um crate
# nosso (aí dá para trocar). As transitivas — hoje a família `unic-*`, que
# chega por urlpattern → tauri-utils — não estão ao nosso alcance; o Dependabot
# traz a correção quando o Tauri trocar.
unmaintained = "workspace"
# zip < 9 (RUSTSEC-2026-0367/0368/0369/0429: links simbólicos e SUID/SGID ao
# extrair um zip de terceiros, no Unix). Chega por dois caminhos fora do nosso
# alcance, e nenhum extrai zip de quem não confiamos: o build do
# sherpa-onnx-sys (o pacote dele, na compilação) e o tauri-plugin-updater (a
# atualização, depois da assinatura conferida com a nossa chave). O ISPer é
# Windows. Sair daqui quando os dois aceitarem zip 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 2 (build do sherpa-onnx-sys, só o pacote dele) e zip 4 (tauri-plugin-updater, só depois da assinatura conferida); sem zip 9 em nenhum dos dois até 19/10/2026: tirar quando atualizarem" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2 (build do sherpa-onnx-sys, só o pacote dele) e zip 4 (tauri-plugin-updater, só depois da assinatura conferida); sem zip 9 em nenhum dos dois até 19/10/2026: tirar quando atualizarem" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2 (build do sherpa-onnx-sys, só o pacote dele) e zip 4 (tauri-plugin-updater, só depois da assinatura conferida); sem zip 9 em nenhum dos dois até 19/10/2026: tirar quando atualizarem" },
    { id = "RUSTSEC-2026-0429", reason = "zip 2 (build do sherpa-onnx-sys, só o pacote dele) e zip 4 (tauri-plugin-updater, só depois da assinatura conferida); sem zip 9 em nenhum dos dois até 19/10/2026: tirar quando atualizarem" },
    { id = "RUSTSEC-2026-0545", reason = "só o zip 2.4.2 do build do sherpa-onnx-sys (abre o pacote pré-compilado dele, de URL fixa); o zip do app já é o 9.4.2, corrigido: tirar quando o sherpa-onnx-sys atualizar" },
    { id = "RUSTSEC-2026-0548", reason = "só o zip 2.4.2 do build do sherpa-onnx-sys (abre o pacote pré-compilado dele, de URL fixa); o zip do app já é o 9.4.2, corrigido: tirar quando o sherpa-onnx-sys atualizar" },
    # chrono "sem manutenção" (aviso informativo, sem falha conhecida e sem
    # versão corrigida): ele está no app, no assistente e no Tauri. A troca
    # por jiff/time é uma migração própria; até lá, o aviso fica registrado.
    { id = "RUSTSEC-2026-0543", reason = "chrono sem manutenção desde 14/09/2026, sem versão corrigida; usado pelo app, isper-assist/agent e dependências do Tauri: migrar para jiff numa mudança própria" },
]

[licenses]
version = 2
# Só licenças permissivas/compatíveis com o MIT do projeto. Tudo fora da lista
# quebra o CI — adicionar aqui é uma decisão consciente, com revisão.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Licenças da lista que nenhum crate usa hoje não geram aviso: a lista é a
# política, não um espelho do Cargo.lock.
unused-allowed-license = "allow"

# `ring` tem texto de licença misto (ISC + OpenSSL + MIT); o cargo-deny não
# consegue inferir sozinho e precisa desta clarificação.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Versões duplicadas inflam o binário e o tempo de build, mas num app Tauri
# elas vêm aos montes do ecossistema Windows (`windows-*`, `toml`, `syn`) e
# não estão ao nosso alcance: 40+ avisos só escondem o que importa.
# Para inspecionar: `cargo deny check bans` com `multiple-versions = "warn"`.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
