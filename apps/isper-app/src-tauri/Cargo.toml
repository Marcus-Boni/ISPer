[package]
name = "isper-app"
version = "0.12.2"
edition = "2021"
license = "MIT"
publish = false

[features]
# CUDA ligado por padrão (RTX 4050). Sem GPU NVIDIA: --no-default-features.
default = ["cuda"]
cuda = ["isper-core/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Atualização automática: latest.json assinado (minisign) nas releases do GitHub.
tauri-plugin-updater = "2"
# Pastas conhecidas do Windows (ver paths.rs).
dirs = "6"
toml = "0.8"
isper-core = { path = "../../../crates/isper-core" }
isper-llm = { path = "../../../crates/isper-llm" }
isper-models = { path = "../../../crates/isper-models" }
isper-diarize = { path = "../../../crates/isper-diarize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# env-filter: nível `info` por padrão (as dependências em DEBUG são ruidosas —
# o keyring, por exemplo, loga cada acesso ao Credential Manager), com
# RUST_LOG para investigar.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Log em arquivo com rotação diária (%LOCALAPPDATA%\ISPer\logs) — o exe é
# windows_subsystem, então o stdout ninguém vê.
tracing-appender = "0.2"
arboard = "3.6.1"
enigo = "0.6.1"
chrono = "0.4.45"

[target.'cfg(windows)'.dependencies]
# SetWindowPos direto: reafirma o indicador no topo da faixa "sempre no topo"
# (o tao não reaplica a flag quando ela já está ligada).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Toasts do Windows (mesma base do plugin oficial) + registro do nosso
# AppUserModelID no HKCU para o exe "solto" aparecer como ISPer, com ícone.
tauri-winrt-notification = "0.7"
winreg = "0.55"

[lints]
workspace = true
