[package]
name = "isper-app"
version = "0.2.0"
edition = "2021"

[features]
cuda = ["isper-core/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
toml = "0.8"
isper-core = { path = "../../../crates/isper-core" }
isper-llm = { path = "../../../crates/isper-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
arboard = "3.6.1"
enigo = "0.6.1"
chrono = "0.4.45"
