<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ISPer — Biblioteca</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
  .crumb { color: var(--muted); font-size: 13px; margin-left: -4px; }
  .crumb::before { content: "/"; margin-right: 8px; color: var(--muted-2); }
  .tabs { margin-left: 8px; }
  .search { position: relative; margin-left: auto; width: 320px; }
  .search .field { padding-right: 30px; }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%) scale(.8); opacity: 0; pointer-events: none;
    width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--panel-3); color: var(--muted);
    font-size: 12px; cursor: pointer; display: grid; place-items: center;
    transition: opacity var(--dur-2), transform var(--dur-2) var(--ease-spring), color var(--dur-2);
  }
  .search.has-text .clear { opacity: 1; pointer-events: auto; transform: translateY(-50%); }
  .search .clear:hover { color: var(--ink); }
  .count { font-size: 12px; color: var(--muted); min-width: 70px; text-align: right; }

  main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: rgba(30, 26, 24, .5); }
  .item {
    position: relative; padding: 12px 16px 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background var(--dur-2);
  }
  .item::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
    background: var(--accent); transform: scaleY(0); transition: transform var(--dur-3) var(--ease-spring);
  }
  .item:hover { background: var(--panel); }
  .item.on { background: var(--panel-2); }
  .item.on::before { transform: scaleY(1); }
  .item .t { font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--dur-2); }
  .item.on .t { color: var(--accent-2); }
  .item .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--good); border-color: rgba(132, 194, 151, .45); }

  #detail { overflow-y: auto; padding: 24px 30px; }
  .placeholder { color: var(--muted); padding: 60px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .placeholder .empty-art { width: 56px; }
  .dhead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
  .dhead h2 { font-family: var(--font-display); font-size: 26px; font-weight: 500; letter-spacing: -.015em; margin: 0; flex: 1; cursor: text; line-height: 1.15; border-radius: 6px; transition: background var(--dur-2); }
  .dhead h2:hover { background: var(--panel); box-shadow: 0 0 0 6px var(--panel); }
  .dhead input { flex: 1; font: 500 26px var(--font-display); letter-spacing: -.015em; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--accent); background: var(--bg-2); color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  h3.eyebrow { margin: 24px 0 10px; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; white-space: pre-wrap; line-height: 1.6; }
  .seg { display: grid; grid-template-columns: 52px 130px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.5; }
  .seg .ts { color: var(--muted-2); font: 12px var(--font-mono); padding-top: 2px; }
  .seg .sp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp.eu { color: var(--accent); } .sp.p1 { color: var(--p1); } .sp.p2 { color: var(--p2); } .sp.p3 { color: var(--p3); } .sp.p4 { color: var(--p4); } .sp.p5 { color: var(--p5); } .sp.px { color: var(--muted); }

  .dict { display: grid; grid-template-columns: 150px 1fr auto auto; gap: 12px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); transition: background var(--dur-2); }
  .dict:hover { background: var(--panel); }
  .dict .at { color: var(--muted-2); font: 12px var(--font-mono); padding-top: 3px; }
  .dict .tx { line-height: 1.5; }
</style>
</head>
<body class="atmos">
<header class="bar">
  <div class="brand">ISPer<span>.</span></div>
  <span class="crumb">Biblioteca</span>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="meetings">Reuniões</button>
    <button class="tab" data-tab="dictations">Ditados</button>
  </div>
  <div class="search" id="searchbox">
    <input id="search" class="field" type="search" placeholder="buscar no título, resumo e transcript…" autocomplete="off">
    <button class="clear" id="clear" title="limpar" aria-label="limpar busca">×</button>
  </div>
  <span class="count num" id="count"></span>
  <button class="btn btn-ghost" id="openfolder">Abrir pasta</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script src="assets/ui.js"></script>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  const { el, toast, fmtClock, plural } = UI;
  function spClass(sp) {
    if (sp === 'Eu') return 'eu';
    const m = sp.match(/^Participante (\d+)/);
    return m ? 'p' + Math.min(5, Number(m[1])) : 'px';
  }
  function placeholder(text) {
    const p = el('div', 'placeholder');
    const art = el('div', 'empty-art'); art.append(el('i'), el('i'), el('i'));
    p.append(art, el('span', '', text));
    return p;
  }

  let tab = 'meetings';
  let selected = null;
  let loading = 0;   // nº de buscas em voo (evita mostrar skeleton em atualizações silenciosas)

  // ------------------------------------------------------------ reuniões
  async function loadMeetings(silent = false) {
    const q = $('search').value;
    const list = $('list');
    if (!silent && !list.children.length) UI.skeleton(list, 5);
    let rows = [];
    try { rows = await invoke('list_meetings', { query: q || null }); }
    catch (e) { toast('erro: ' + e, 'err'); return; }
    $('count').textContent = rows.length ? plural(rows.length, 'reunião', 'reuniões') : '';
    const signature = rows.map(r => r.id + ':' + r.title + ':' + r.has_summary + ':' + (selected === r.id)).join('|');
    if (list.dataset.sig === signature) return;
    list.dataset.sig = signature;
    const animate = !silent;
    list.replaceChildren();
    if (!rows.length) { list.appendChild(placeholder(q ? 'nada encontrado para "' + q + '"' : 'nenhuma reunião ainda — grave uma pela tela Início ou pela bandeja')); return; }
    for (const r of rows) {
      const it = el('div', 'item' + (selected === r.id ? ' on' : ''));
      it.tabIndex = 0;
      it.appendChild(el('div', 't', r.title));
      const m = el('div', 'm');
      m.appendChild(el('span', '', r.started_at));
      m.appendChild(el('span', 'num', fmtClock(r.duration_secs)));
      m.appendChild(el('span', 'badge', plural(r.participants, 'participante', 'participantes')));
      if (r.has_summary) m.appendChild(el('span', 'badge ok', 'resumo IA'));
      it.appendChild(m);
      const pick = () => { if (selected === r.id) return; selected = r.id; list.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === it)); list.dataset.sig = ''; showMeeting(r.id); };
      it.addEventListener('click', pick);
      it.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
      list.appendChild(it);
    }
    if (animate) UI.stagger(list.children, 10);
  }

  async function showMeeting(id) {
    const d = $('detail');
    let det;
    try { det = await invoke('get_meeting', { id }); } catch (e) { toast('erro: ' + e, 'err'); return; }
    UI.swap(d, () => {
      d.replaceChildren();
      if (!det) { d.appendChild(placeholder('reunião não encontrada')); return; }
      const m = det.meeting;

      const head = el('div', 'dhead');
      const h2 = el('h2', '', m.title);
      h2.title = 'clique para renomear';
      h2.addEventListener('click', () => {
        const input = el('input'); input.value = m.title;
        head.replaceChild(input, h2); input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return; done = true;
          const t = input.value.trim();
          if (t && t !== m.title) {
            try { await invoke('rename_meeting', { id, title: t }); toast('renomeada', 'ok'); }
            catch (e) { toast('erro: ' + e, 'err'); }
          }
          await loadMeetings(true); showMeeting(id);
        };
        input.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; showMeeting(id); } });
        input.addEventListener('blur', commit);
      });
      head.appendChild(h2);
      d.appendChild(head);
      d.appendChild(el('div', 'meta', m.started_at + ' · ' + fmtClock(m.duration_secs) + ' · ' + m.segments + ' segmentos · ' + plural(m.participants, 'participante', 'participantes')));

      const actions = el('div', 'actions');
      const bOpen = el('button', 'btn', 'Abrir .md'); bOpen.disabled = !m.md_path;
      bOpen.addEventListener('click', () => invoke('open_meeting_file', { id }).catch(e => toast('erro: ' + e, 'err')));
      const bDel = el('button', 'btn btn-danger', 'Excluir do histórico');
      bDel.title = 'o arquivo .md continua na pasta';
      bDel.addEventListener('click', () => UI.confirmInline(bDel, async () => {
        try { await invoke('delete_meeting', { id }); selected = null; toast('excluída do histórico — o arquivo .md continua na pasta', 'ok'); }
        catch (e) { toast('erro: ' + e, 'err'); }
        UI.swap($('detail'), () => $('detail').replaceChildren(placeholder('Selecione uma reunião à esquerda.')));
        $('list').dataset.sig = '';
        loadMeetings(true);
      }, { label: 'Excluir mesmo?' }));
      actions.append(bOpen, bDel);
      d.appendChild(actions);

      if (det.summary) {
        d.appendChild(el('h3', 'eyebrow', 'Resumo (IA)'));
        d.appendChild(el('div', 'summary', det.summary));
      }
      d.appendChild(el('h3', 'eyebrow', 'Transcript'));
      let last = null, group = null, n = 0;
      for (const s of det.segments) {
        if (s.speaker !== last) {
          group = el('div', 'seg');
          if (n < 14) { group.classList.add('reveal'); group.style.setProperty('--i', String(n)); }
          n++;
          group.appendChild(el('div', 'ts', fmtClock(s.start_secs)));
          group.appendChild(el('div', 'sp ' + spClass(s.speaker), s.speaker));
          group.appendChild(el('div', 'tx', s.text));
          d.appendChild(group);
          last = s.speaker;
        } else {
          group.lastElementChild.textContent += ' ' + s.text;
        }
      }
      if (!det.segments.length) d.appendChild(placeholder('sem transcript'));
    });
    d.scrollTop = 0;
  }

  // ------------------------------------------------------------- ditados
  async function loadDictations(silent = false) {
    const q = $('search').value;
    const list = $('list');
    if (!silent && !list.children.length) UI.skeleton(list, 6);
    let rows = [];
    try { rows = await invoke('list_dictations', { query: q || null }); }
    catch (e) { toast('erro: ' + e, 'err'); return; }
    $('count').textContent = rows.length ? plural(rows.length, 'ditado', 'ditados') : '';
    const signature = rows.map(r => r.id).join('|');
    if (list.dataset.sig === signature) return;
    list.dataset.sig = signature;
    list.replaceChildren();
    $('detail').replaceChildren(placeholder(rows.length ? '"copiar" reutiliza um texto ditado; "×" remove do histórico.' : 'Seus ditados aparecem aqui.'));
    if (!rows.length) { list.appendChild(placeholder(q ? 'nada encontrado' : 'nenhum ditado ainda')); return; }
    for (const r of rows) {
      const row = el('div', 'dict');
      row.appendChild(el('div', 'at', r.at));
      row.appendChild(el('div', 'tx', r.text));
      const bCopy = el('button', 'btn btn-sm btn-ghost', 'copiar');
      bCopy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(r.text); UI.flash(bCopy, 'copiado ✓'); }
        catch (_) { toast('não consegui copiar', 'err'); }
      });
      const bDel = el('button', 'btn btn-sm btn-danger', '×'); bDel.title = 'remover do histórico';
      bDel.addEventListener('click', () => UI.confirmInline(bDel, async () => {
        try { await invoke('delete_dictation', { id: r.id }); $('list').dataset.sig = ''; loadDictations(true); }
        catch (e) { toast('erro: ' + e, 'err'); }
      }, { label: 'remover?' }));
      row.append(bCopy, bDel);
      list.appendChild(row);
    }
    if (!silent) UI.stagger(list.children, 10);
  }

  // ----------------------------------------------------------------- ui
  function refresh(silent = false) { if (tab === 'meetings') loadMeetings(silent); else loadDictations(silent); }
  const tabsCtl = UI.tabs($('tabs'), (name) => setTab(name));
  function setTab(t) {
    tab = t;
    $('search').placeholder = t === 'meetings' ? 'buscar no título, resumo e transcript…' : 'buscar nos ditados…';
    $('list').dataset.sig = '';
    $('list').replaceChildren();
    if (t === 'meetings') UI.swap($('detail'), () => $('detail').replaceChildren(placeholder('Selecione uma reunião à esquerda.')));
    refresh();
  }
  let searchTimer = null;
  $('search').addEventListener('input', () => {
    $('searchbox').classList.toggle('has-text', !!$('search').value);
    clearTimeout(searchTimer); searchTimer = setTimeout(() => { $('list').dataset.sig = ''; refresh(true); }, 200);
  });
  $('clear').addEventListener('click', () => { $('search').value = ''; $('searchbox').classList.remove('has-text'); $('list').dataset.sig = ''; refresh(true); $('search').focus(); });
  $('search').addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('search').value) { ev.stopPropagation(); $('clear').click(); } });
  $('openfolder').addEventListener('click', () => invoke('open_meetings_folder').catch(e => toast('erro: ' + e, 'err')));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && document.activeElement !== $('search')) window.__TAURI__.window.getCurrentWindow().close();
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'f') { ev.preventDefault(); $('search').focus(); $('search').select(); }
  });

  // Aberta pelo Início com uma reunião escolhida: seleciona ao carregar e
  // sempre que o Início pedir de novo com esta janela já aberta.
  async function selectPending() {
    let id = null;
    try { id = await invoke('take_pending_meeting'); } catch (_) { return; }
    if (id == null) return;
    if (tab !== 'meetings') tabsCtl.select('meetings');
    selected = id;
    $('list').dataset.sig = '';
    await loadMeetings(true);
    showMeeting(id);
  }
  listen('isper-library-select', selectPending);
  // Reunião nova salva, ditado colado etc. — a lista se mantém atual.
  listen('isper-status', () => refresh(true));
  listen('isper-state', (e) => { if (e.payload.state === 'done' && tab === 'dictations') setTimeout(() => refresh(true), 300); });

  $('detail').replaceChildren(placeholder('Selecione uma reunião à esquerda.'));
  refresh();
  selectPending();
</script>
</body>
</html>
