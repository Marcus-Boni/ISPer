<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ISPer — Biblioteca</title>
<script src="assets/boot.js"></script>
<script src="assets/i18n.js"></script>
<link rel="stylesheet" href="assets/base.css">
<style>
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
  .crumb { color: var(--muted); font-size: 13px; margin-left: -4px; }
  .crumb::before { content: "/"; margin-right: 8px; color: var(--muted-2); }
  .tabs { margin-left: 8px; }
  .search { position: relative; margin-left: auto; width: 320px; }
  .search .field { padding-right: 30px; }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%) scale(.8); opacity: 0; pointer-events: none;
    width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--panel-3); color: var(--muted);
    font-size: 12px; cursor: pointer; display: grid; place-items: center;
    transition: opacity var(--dur-2), transform var(--dur-2) var(--ease-spring), color var(--dur-2);
  }
  .search.has-text .clear { opacity: 1; pointer-events: auto; transform: translateY(-50%); }
  .search .clear:hover { color: var(--ink); }
  .count { font-size: 12px; color: var(--muted); min-width: 70px; text-align: right; }
  /* Busca semântica (só aparece com provider de embeddings configurado). */
  #semantic[aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  #semantic svg { width: 14px; height: 14px; }

  main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; background: color-mix(in srgb, var(--panel) 50%, transparent); }
  /* Ditados: lista de largura inteira — o painel de detalhe não tem o que
     mostrar, e a coluna de 340 px espremia o texto com barra horizontal. */
  main.dictations { grid-template-columns: 1fr; }
  main.dictations #detail { display: none; }
  main.dictations #list { border-right: none; background: transparent; }
  .item {
    position: relative; padding: 12px 16px 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background var(--dur-2);
  }
  .item::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
    background: var(--accent); transform: scaleY(0); transition: transform var(--dur-3) var(--ease-spring);
  }
  .item:hover { background: var(--panel); }
  .item.on { background: var(--panel-2); }
  .item.on::before { transform: scaleY(1); }
  .item .t { font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--dur-2); }
  .item.on .t { color: var(--accent-2); }
  .item .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .item .snip { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
  .badge.score { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); font-variant-numeric: tabular-nums; }

  #detail { overflow-y: auto; padding: 24px 30px; position: relative; }
  .placeholder { color: var(--muted); padding: 60px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .placeholder .empty-art { width: 56px; }
  .dhead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
  .dhead h2 { font-family: var(--font-display); font-size: 26px; font-weight: 500; letter-spacing: -.015em; margin: 0; flex: 1; cursor: text; line-height: 1.15; border-radius: 6px; transition: background var(--dur-2); }
  .dhead h2:hover { background: var(--panel); box-shadow: 0 0 0 6px var(--panel); }
  .dhead input { flex: 1; font: 500 26px var(--font-display); letter-spacing: -.015em; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--accent); background: var(--bg-2); color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .actions .sep { color: var(--muted-2); font-size: 12px; margin-left: 6px; }
  h3.eyebrow { margin: 24px 0 10px; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; white-space: pre-wrap; line-height: 1.6; }
  .seg { display: grid; grid-template-columns: 52px 140px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.5; transition: background var(--dur-2); }
  .seg .ts { color: var(--muted-2); font: 12px var(--font-mono); padding-top: 2px; transition: color var(--dur-2); }
  .seg .sp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background var(--dur-2); }
  .seg .sp:hover { background: var(--panel-2); }
  .seg .sp input { width: 100%; font: 600 13.5px var(--font-body); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--accent); background: var(--bg-2); color: var(--ink); outline: none; }
  .sp.eu { color: var(--accent); } .sp.p1 { color: var(--p1); } .sp.p2 { color: var(--p2); } .sp.p3 { color: var(--p3); } .sp.p4 { color: var(--p4); } .sp.p5 { color: var(--p5); } .sp.px { color: var(--muted); }

  /* Busca dentro da reunião: barra fixa no topo do painel + destaques. */
  .dsearch {
    position: sticky; top: -24px; z-index: 2; margin: 0 -30px 6px; padding: 10px 30px;
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .dsearch .search { margin-left: 0; width: auto; flex: 1; max-width: 380px; }
  .dsearch .count { min-width: 84px; text-align: left; }
  .dsearch .count.none { color: var(--warn); }
  .dsearch .filter[aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .dsearch kbd { font: 11px var(--font-mono); color: var(--muted-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  mark { background: color-mix(in srgb, var(--warn) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 18%, transparent); transition: background var(--dur-2); }
  mark.cur { background: var(--warn); color: var(--accent-ink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 35%, transparent); }
  .seg.hit { background: color-mix(in srgb, var(--warn) 5%, transparent); }
  .seg.hit .ts { color: var(--warn); }
  #detail.filtering .seg:not(.hit), #detail.filtering .sumbox:not(.hit) { display: none; }
  .filtered-note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }

  /* Momentos marcados durante a reunião */
  .moments { display: flex; flex-wrap: wrap; gap: 8px; }
  .moment { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: var(--r-pill); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); color: var(--warn); font: 600 12px var(--font-mono); cursor: pointer; transition: transform var(--dur-1), background var(--dur-2); }
  .moment:hover { background: color-mix(in srgb, var(--warn) 25%, transparent); }
  .moment:active { transform: scale(.96); }
  .moment .ex { font: 12px var(--font-body); color: var(--ink-2); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Decisões validadas no Copilot durante a reunião. Mesma linguagem dos
     cards do HUD (tarja colorida por tipo), em lista vertical. */
  .ico { width: 13px; height: 13px; flex: none; vertical-align: -2px; }
  .badge.warn .ico, .moment .ico { width: 12px; height: 12px; }
  .badge.warn { gap: 4px; }
  .decisions { display: flex; flex-direction: column; gap: 8px; }
  .dec {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line-2);
    border-radius: var(--r); padding: 10px 13px; display: flex; flex-direction: column; gap: 5px;
  }
  .dec-decision { border-left-color: var(--good); }
  .dec-action   { border-left-color: var(--info); }
  .dec-risk     { border-left-color: var(--warn); }
  .dec-question { border-left-color: var(--p2); }
  .dec-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .dec-kind { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; }
  .dk-decision { background: var(--good-soft); color: var(--good); }
  .dk-action   { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
  .dk-risk     { background: var(--warn-soft); color: var(--warn); }
  .dk-question { background: color-mix(in srgb, var(--p2) 16%, transparent); color: var(--p2); }
  .dec-urg { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .dec-at {
    margin-left: auto; font: 11px var(--font-mono); color: var(--muted-2);
    background: none; border: none; padding: 2px 5px; border-radius: 4px; cursor: pointer;
  }
  .dec-at:hover { color: var(--accent); background: var(--accent-soft); }
  .dec-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .dec-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .dec-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .dec-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: var(--r-pill); background: var(--panel-3); color: var(--ink-2); font-size: 11px; }
  .dec-pill .ico, .dec-urg .ico, .dec-kind .ico { width: 11px; height: 11px; }
  .dec-urg, .dec-kind { display: inline-flex; align-items: center; gap: 4px; }
  .dec-pill.alert { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .seg.star { box-shadow: inset 3px 0 0 var(--warn); padding-left: 8px; }
  .seg.target { animation: target-flash 1.6s ease-out both; }
  @keyframes target-flash { 0% { background: color-mix(in srgb, var(--warn) 35%, transparent); } 100% { background: transparent; } }

  /* Ditados: hora · texto · ações, numa linha que usa a largura inteira. */
  .dict-note { color: var(--muted); font-size: 12.5px; padding: 12px 22px 10px; border-bottom: 1px solid var(--line); line-height: 1.5; }
  .dict { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto auto; gap: 12px; align-items: start; padding: 10px 22px; border-bottom: 1px solid var(--line); transition: background var(--dur-2); }
  .dict:hover { background: var(--panel); }
  .dict .at { color: var(--muted-2); font: 12px var(--font-mono); padding-top: 3px; white-space: nowrap; }
  .dict .tx { line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
  .dict .tx .chip { margin-left: 8px; cursor: help; }
  .dict .tx .badge { margin-left: 8px; }
  @media (max-width: 620px) {
    .dict { grid-template-columns: minmax(0, 1fr) auto auto; }
    .dict .at { grid-column: 1 / -1; padding-top: 0; }
  }
</style>
</head>
<body class="atmos">
<header class="bar">
  <div class="brand">ISPer<span>.</span></div>
  <span class="crumb" data-i18n="library.top.biblioteca">Biblioteca</span>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="meetings" data-i18n="library.top.reunioes">Reuniões</button>
    <button class="tab" data-tab="dictations" data-i18n="library.top.ditados">Ditados</button>
  </div>
  <div class="search" id="searchbox">
    <input id="search" class="field" type="search" placeholder="buscar no título, resumo e transcript…" autocomplete="off" data-i18n-attr="placeholder:library.top.buscar-titulo-resumo-transcript.placeholder">
    <button class="clear" id="clear" title="limpar" aria-label="limpar busca" data-i18n-attr="title:library.top.limpar.title,aria-label:library.top.limpar-busca.aria">×</button>
  </div>
  <button class="btn btn-ghost btn-sm" id="semantic" aria-pressed="false" hidden title="busca pelo sentido (embeddings): 'quando falamos do orçamento?' acha o trecho mesmo sem a palavra exata" data-i18n-attr="title:library.top.busca-pelo-sentido-embeddings-quando.title">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/><path d="M5 7h4M7 5v4" opacity=".7"/></svg>
    <span data-i18n="library.semantic">Semântica</span>
  </button>
  <span class="count num" id="count"></span>
  <button class="btn btn-ghost" id="openfolder" data-i18n="library.top.openfolder">Abrir pasta</button>
</header>
<main id="main">
  <div id="list"></div>
  <div id="detail"></div>
</main>
<script src="assets/ui.js"></script>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (id) => document.getElementById(id);
  const { el, toast, fmtClock } = UI;
  const speaker = UI.speaker;

  // Ícones da tela (mesmo desenho dos do Copilot: 16x16, currentColor).
  const GLYPH_NS = 'http://www.w3.org/2000/svg';
  const GLYPHS = { star: ['m8 1.9 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.7l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.9Z'] };
  function mkGlyph(name) {
    const svg = document.createElementNS(GLYPH_NS, 'svg');
    const base = { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor',
      'stroke-width': '1.4', 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'aria-hidden': 'true', class: 'ico' };
    for (const k in base) svg.setAttribute(k, base[k]);
    (GLYPHS[name] || []).forEach((d) => {
      const pth = document.createElementNS(GLYPH_NS, 'path');
      pth.setAttribute('d', d);
      svg.appendChild(pth);
    });
    return svg;
  }
  // Mesmas regras do núcleo (meeting.rs): um parágrafo só continua se for o
  // mesmo falante, com pausa < 4 s e sem passar de 60 s.
  const GROUP_MAX_SECS = 60, GROUP_GAP_SECS = 4;
  function groupSpeech(segments) {
    const groups = [];
    for (const s of segments) {
      const text = (s.text || '').trim();
      if (!text) continue;
      const g = groups[groups.length - 1];
      if (g && g.speaker === s.speaker && s.start_secs - g.end_secs < GROUP_GAP_SECS && s.end_secs - g.start_secs <= GROUP_MAX_SECS) {
        g.text += ' ' + text; g.end_secs = Math.max(g.end_secs, s.end_secs);
      } else groups.push({ speaker: s.speaker, start_secs: s.start_secs, end_secs: s.end_secs, text });
    }
    return groups;
  }
  function placeholder(text) {
    const p = el('div', 'placeholder');
    const art = el('div', 'empty-art'); art.append(el('i'), el('i'), el('i'));
    p.append(art, el('span', '', text));
    return p;
  }
  async function copyText(text, btn, label) {
    try { await navigator.clipboard.writeText(text); UI.flash(btn, label || t('common.copied')); }
    catch (_) { toast(t('library.copy-failed'), 'err'); }
  }
  // Algo clicável que não é <button> (título, nome de falante): entra no Tab,
  // ganha papel e nome, e Enter ou Espaço fazem o clique.
  function keyboardClick(node, label) {
    node.tabIndex = 0;
    node.setAttribute('role', 'button');
    if (label) node.setAttribute('aria-label', label);
    node.addEventListener('keydown', (ev) => {
      if (ev.target !== node || (ev.key !== 'Enter' && ev.key !== ' ')) return;
      ev.preventDefault();
      node.click();
    });
  }
  const pct = (score) => Math.round(Math.max(0, Math.min(1, score)) * 100) + '%';

  let tab = 'meetings';
  let selected = null;
  let semantic = false;          // busca pelo sentido ligada (botão "Semântica")
  let semanticAvailable = false; // provider de embeddings configurado
  const meetingQuery = {};   // id → último termo buscado dentro da reunião

  // --------------------------------------------- busca com destaque (texto)
  // Casamento literal, sem diferenciar maiúsculas nem acentos ("reuniao" acha
  // "Reunião"). Cada caractere é "dobrado" separadamente para mapear os
  // índices do texto dobrado de volta ao original.
  const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function findRanges(raw, q) {
    const fq = fold(q);
    if (!fq) return [];
    const norm = [], idx = [];
    for (let i = 0; i < raw.length; i++) { for (const ch of fold(raw[i])) { norm.push(ch); idx.push(i); } }
    const hay = norm.join('');
    const out = [];
    let p = hay.indexOf(fq);
    while (p !== -1) {
      out.push([idx[p], idx[p + fq.length - 1] + 1]);
      p = hay.indexOf(fq, p + fq.length);
    }
    return out;
  }
  // Reescreve `node` com o texto cru e <mark> nos trechos casados; devolve quantos.
  function paint(node, q) {
    const raw = node.dataset.raw || '';
    const ranges = q ? findRanges(raw, q) : [];
    node.replaceChildren();
    let last = 0;
    for (const [a, b] of ranges) {
      if (a > last) node.append(raw.slice(last, a));
      node.appendChild(el('mark', '', raw.slice(a, b)));
      last = b;
    }
    if (last < raw.length) node.append(raw.slice(last));
    return ranges.length;
  }

  // A busca semântica só faz sentido com pergunta de verdade (≥ 3 caracteres).
  const semanticActive = () => semantic && semanticAvailable && $('search').value.trim().length >= 3;

  // ------------------------------------------------------------ reuniões
  function meetingItem(r, extra) {
    const it = el('div', 'item' + (selected === r.id ? ' on' : ''));
    it.tabIndex = 0;
    it.setAttribute('role', 'button');
    if (selected === r.id) it.setAttribute('aria-current', 'true');
    it.appendChild(el('div', 't', r.title));
    const m = el('div', 'm');
    m.appendChild(el('span', '', r.started_at));
    m.appendChild(el('span', 'num', fmtClock(r.duration_secs)));
    if (extra && extra.score != null) { const s = el('span', 'badge score', pct(extra.score)); s.title = t('library.score-title'); m.appendChild(s); }
    if (r.participants != null) m.appendChild(el('span', 'badge', t('library.participants', { n: r.participants })));
    if (r.has_summary) m.appendChild(el('span', 'badge ok', t('library.ai-summary')));
    if (r.moments) { const b = el('span', 'badge warn'); b.append(mkGlyph('star'), document.createTextNode(String(r.moments))); b.title = t('library.moments-title', { n: r.moments }); m.appendChild(b); }
    if (r.decisions) { const b = el('span', 'chip chip-ok', String(r.decisions)); b.title = t('library.decisions-title', { n: r.decisions }); m.appendChild(b); }
    it.appendChild(m);
    if (extra && extra.snippet) {
      const snip = el('div', 'snip');
      if (extra.start_secs != null) snip.appendChild(el('span', 'num', '[' + fmtClock(extra.start_secs) + '] '));
      snip.append(extra.snippet);
      it.appendChild(snip);
    }
    return it;
  }

  async function loadMeetings(silent = false) {
    const q = $('search').value;
    const list = $('list');
    if (!silent && !list.children.length) UI.skeleton(list, 5);
    let rows = [], hits = null;
    try {
      if (semanticActive()) {
        hits = await invoke('semantic_search', { kind: 'meeting', query: q, limit: 30 });
        rows = hits.map(h => ({ id: h.id, title: h.title, started_at: h.started_at, duration_secs: h.duration_secs, participants: null, has_summary: false, moments: 0 }));
      } else rows = await invoke('list_meetings', { query: q || null });
    }
    catch (e) { toast(t('common.error', { e }), 'err'); return; }
    $('count').textContent = rows.length ? t('library.count.meetings', { n: rows.length }) : '';
    const signature = (hits ? 'sem|' : 'lit|') + rows.map(r => r.id + ':' + r.title + ':' + r.has_summary + ':' + (selected === r.id)).join('|') + '|' + q;
    if (list.dataset.sig === signature) return;
    list.dataset.sig = signature;
    const animate = !silent;
    list.replaceChildren();
    if (!rows.length) { list.appendChild(placeholder(q ? (hits ? t('library.empty.semantic', { q }) : t('library.empty.meetings-query', { q })) : t('library.empty.meetings'))); return; }
    rows.forEach((r, i) => {
      const hit = hits ? hits[i] : null;
      const it = meetingItem(r, hit);
      const pick = () => {
        const at = hit && hit.start_secs != null ? hit.start_secs : null;
        if (selected === r.id && at == null) return;
        selected = r.id;
        list.querySelectorAll('.item').forEach(x => { x.classList.toggle('on', x === it); if (x === it) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current'); });
        list.dataset.sig = '';
        showMeeting(r.id, { at, semantic: !!hit });
      };
      it.addEventListener('click', pick);
      it.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
      list.appendChild(it);
    });
    if (animate) UI.stagger(list.children, 10);
  }

  async function showMeeting(id, opts = {}) {
    const d = $('detail');
    let det;
    try { det = await invoke('get_meeting', { id }); } catch (e) { toast(t('common.error', { e }), 'err'); return; }
    const keepScroll = opts.keepScroll ? d.scrollTop : null;
    let jumpTo = null;   // elemento do trecho pedido pela busca semântica
    UI.swap(d, () => {
      d.replaceChildren();
      d.classList.remove('filtering');
      if (!det) { d.appendChild(placeholder(t('library.not-found'))); return; }
      const m = det.meeting;
      const groups = groupSpeech(det.segments);
      // Cores por ordem de aparição — nomes personalizados continuam coloridos.
      const order = [];
      const spClass = (sp) => {
        if (sp === 'Eu') return 'eu';
        let i = order.indexOf(sp);
        if (i < 0) { order.push(sp); i = order.length - 1; }
        return 'p' + (Math.min(i, 4) + 1);
      };
      const transcriptText = () => groups.map(g => '[' + fmtClock(g.start_secs) + '] ' + speaker(g.speaker) + ': ' + g.text).join('\n');

      const head = el('div', 'dhead');
      const h2 = el('h2', '', m.title);
      h2.title = t('library.rename-title');
      keyboardClick(h2, t('library.rename-aria', { title: m.title }));
      h2.addEventListener('click', () => {
        const input = el('input'); input.value = m.title;
        head.replaceChild(input, h2); input.focus(); input.select();
        let done = false;
        const commit = async () => {
          if (done) return; done = true;
          const title = input.value.trim();
          if (title && title !== m.title) {
            try { await invoke('rename_meeting', { id, title }); toast(t('library.renamed'), 'ok'); }
            catch (e) { toast(t('common.error', { e }), 'err'); }
          }
          await loadMeetings(true); showMeeting(id, { keepScroll: true });
        };
        input.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; showMeeting(id, { keepScroll: true }); } });
        input.addEventListener('blur', commit);
      });
      head.appendChild(h2);
      d.appendChild(head);
      d.appendChild(el('div', 'meta', t('library.meta', { at: m.started_at, dur: fmtClock(m.duration_secs), segs: t('library.segments', { n: m.segments }), people: t('library.participants', { n: m.participants }) })));

      const actions = el('div', 'actions');
      const bOpen = el('button', 'btn', t('library.open-md')); bOpen.disabled = !m.md_path;
      bOpen.addEventListener('click', () => invoke('open_meeting_file', { id }).catch(e => toast(t('common.error', { e }), 'err')));
      actions.appendChild(bOpen);
      if (det.summary) {
        const bSum = el('button', 'btn btn-ghost', t('library.copy-summary'));
        bSum.addEventListener('click', () => copyText(det.summary, bSum, t('library.summary-copied')));
        actions.appendChild(bSum);
      }
      const bTx = el('button', 'btn btn-ghost', t('library.copy-transcript'));
      bTx.addEventListener('click', () => copyText(transcriptText(), bTx, t('library.transcript-copied')));
      actions.appendChild(bTx);
      actions.appendChild(el('span', 'sep', t('library.export')));
      for (const fmt of ['srt', 'docx']) {
        const b = el('button', 'btn btn-ghost btn-sm', fmt.toUpperCase());
        b.title = fmt === 'srt' ? t('library.export.srt') : t('library.export.docx');
        b.addEventListener('click', async () => {
          UI.busy(b, true);
          try { const path = await invoke('export_meeting', { id, format: fmt }); UI.busy(b, false); UI.flash(b, t('common.saved')); toast(t('library.exported', { path }), 'ok', 4000); }
          catch (e) { UI.busy(b, false); toast(t('library.export-failed', { e }), 'err'); }
        });
        actions.appendChild(b);
      }
      const bDel = el('button', 'btn btn-danger ml-auto', t('library.delete'));
      bDel.title = t('library.delete-title');
      // Exclui na hora e oferece Desfazer (o app só apaga de fato depois).
      bDel.addEventListener('click', async () => {
        let sched;
        try { sched = await invoke('delete_meeting', { id }); }
        catch (e) { toast(t('common.error', { e }), 'err'); return; }
        selected = null;
        UI.swap($('detail'), () => $('detail').replaceChildren(placeholder(t('library.select'))));
        $('list').dataset.sig = '';
        loadMeetings(true);
        UI.undoable(t('library.deleted'), sched, async (ok) => {
          if (!ok) { toast(t('library.too-late-meeting'), 'err'); return; }
          selected = id;
          $('list').dataset.sig = '';
          await loadMeetings(true);
          showMeeting(id);
          toast(t('library.restored'), 'ok');
        });
      });
      actions.appendChild(bDel);
      d.appendChild(actions);

      // Barra de busca da reunião (fixa no topo enquanto o transcript rola).
      const bar = el('div', 'dsearch');
      const box = el('div', 'search');
      const input = el('input', 'field'); input.type = 'search'; input.id = 'msearch'; input.autocomplete = 'off';
      input.placeholder = t('library.msearch.placeholder'); input.title = t('library.msearch.hint');
      const clear = el('button', 'clear', '×'); clear.title = t('library.top.limpar.title'); clear.setAttribute('aria-label', t('library.msearch.clear-aria'));
      box.append(input, clear);
      const count = el('span', 'count num');
      const prev = el('button', 'btn btn-ghost btn-icon', '↑'); prev.title = t('library.msearch.prev-title'); prev.setAttribute('aria-label', t('library.msearch.prev-aria'));
      const next = el('button', 'btn btn-ghost btn-icon', '↓'); next.title = t('library.msearch.next-title'); next.setAttribute('aria-label', t('library.msearch.next-aria'));
      const filter = el('button', 'btn btn-sm filter', t('library.msearch.filter')); filter.setAttribute('aria-pressed', 'false'); filter.title = t('library.msearch.filter-title');
      const hint = el('kbd', '', 'Ctrl+F');
      bar.append(box, count, prev, next, filter, hint);
      d.appendChild(bar);

      let sumbox = null;
      if (det.summary) {
        sumbox = el('div', 'sumbox');
        sumbox.appendChild(el('h3', 'eyebrow', t('library.summary')));
        const sum = el('div', 'summary'); sum.dataset.raw = det.summary; sum.textContent = det.summary;
        sumbox.appendChild(sum);
        d.appendChild(sumbox);
      }
      // Momentos marcados: chips com horário + começo da fala; clique rola até ela.
      const moments = det.moments || [];
      const groupAt = (t) => { let best = null; for (const g of groups) { if (g.start_secs <= t + 0.5) best = g; else break; } return best || groups[0]; };
      const segEls = new Map(); // group → elemento .seg (preenchido abaixo)
      const flashTo = (target) => {
        if (!target) return;
        target.scrollIntoView({ block: 'center', behavior: UI.reduce() ? 'auto' : 'smooth' });
        target.classList.remove('target'); void target.offsetWidth; target.classList.add('target');
      };
      // Decisões validadas no Copilot: o que você confirmou ao vivo, com o
      // horário da fala que deu origem a cada uma (clique para ir até lá).
      const decisions = det.decisions || [];
      if (decisions.length) {
        const DEC_LABEL = { decision: t('library.dec.decision'), action: t('library.dec.action'), risk: t('library.dec.risk'), question: t('library.dec.question') };
        // Mesmo desenho dos ícones do Copilot: 16x16, traço em currentColor.
        const NS = 'http://www.w3.org/2000/svg';
        const PATHS = {
          person: ['M3.4 13.6c0-2.6 2.1-4.2 4.6-4.2s4.6 1.6 4.6 4.2'],
          calendar: ['M2.2 6.6h11.6M5.4 1.8v3M10.6 1.8v3', 'M3.8 3.6h8.4a1.6 1.6 0 0 1 1.6 1.6v7.2a1.6 1.6 0 0 1-1.6 1.6H3.8a1.6 1.6 0 0 1-1.6-1.6V5.2a1.6 1.6 0 0 1 1.6-1.6Z'],
          alert: ['M8 2.4 14.6 13.6H1.4L8 2.4Z', 'M8 6.4v3.2M8 11.8h.01'],
        };
        const mkIcon = (name) => {
          const svg = document.createElementNS(NS, 'svg');
          const base = { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor',
            'stroke-width': '1.4', 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            'aria-hidden': 'true', class: 'ico' };
          for (const k in base) svg.setAttribute(k, base[k]);
          if (name === 'person') {
            const c = document.createElementNS(NS, 'circle');
            c.setAttribute('cx', '8'); c.setAttribute('cy', '5.2'); c.setAttribute('r', '2.4');
            svg.appendChild(c);
          }
          (PATHS[name] || []).forEach((d) => {
            const pth = document.createElementNS(NS, 'path');
            pth.setAttribute('d', d);
            svg.appendChild(pth);
          });
          return svg;
        };
        const pill = (name, text, cls) => {
          const el2 = el('span', cls);
          el2.append(mkIcon(name), document.createTextNode(text));
          return el2;
        };
        d.appendChild(el('h3', 'eyebrow', t('library.dec.heading')));
        const decBox = el('div', 'decisions');
        for (const dec of decisions) {
          const card = el('div', 'dec dec-' + dec.kind);
          const top = el('div', 'dec-top');
          top.appendChild(el('span', 'dec-kind dk-' + dec.kind, DEC_LABEL[dec.kind] || dec.kind));
          if (dec.urgency === 'high') top.appendChild(pill('alert', t('library.dec.urgent'), 'dec-urg'));
          const at = el('button', 'dec-at', fmtClock(dec.at_secs));
          at.title = t('library.dec.goto');
          at.addEventListener('click', () => flashTo(segEls.get(groupAt(dec.at_secs))));
          top.appendChild(at);
          card.appendChild(top);
          card.appendChild(el('div', 'dec-title', dec.title));
          if (dec.description) card.appendChild(el('div', 'dec-desc', dec.description));
          const noDue = dec.kind === 'action'
            && (!dec.due_date || /sem prazo|n[ãa]o definido|no deadline|not set|tbd/i.test(dec.due_date));
          if (dec.owner || dec.kind === 'action') {
            const meta = el('div', 'dec-meta');
            if (dec.owner) meta.appendChild(pill('person', dec.owner, 'dec-pill'));
            if (dec.kind === 'action') {
              meta.appendChild(pill(noDue ? 'alert' : 'calendar',
                noDue ? t('library.dec.no-due') : dec.due_date,
                'dec-pill' + (noDue ? ' alert' : '')));
            }
            card.appendChild(meta);
          }
          decBox.appendChild(card);
        }
        d.appendChild(decBox);
      }
      if (moments.length) {
        d.appendChild(el('h3', 'eyebrow', t('library.moments')));
        const box = el('div', 'moments');
        for (const at of moments) {
          const g = groupAt(at);
          const chip = el('button', 'moment');
          chip.append(mkGlyph('star'), el('span', '', fmtClock(at)));
          if (g) chip.appendChild(el('span', 'ex', g.text));
          chip.title = t('library.moment-goto');
          chip.addEventListener('click', () => flashTo(g && segEls.get(g)));
          box.appendChild(chip);
        }
        d.appendChild(box);
      }
      d.appendChild(el('h3', 'eyebrow', t('library.transcript')));

      // Renomear falante: clique no nome → input; Enter aplica em toda a reunião.
      const renameSpeaker = (spEl, from) => {
        const shown = speaker(from);
        const input = el('input'); input.value = shown; input.setAttribute('aria-label', t('library.speaker.aria'));
        spEl.replaceChildren(input); input.focus(); input.select();
        let done = false;
        const restore = () => { spEl.textContent = shown; };
        const commit = async () => {
          if (done) return; done = true;
          const to = input.value.trim();
          if (!to || to === from || to === shown) { restore(); return; }
          try {
            const n = await invoke('rename_speaker', { id, from, to });
            toast(t('library.speaker.renamed', { n, to }), 'ok');
            await loadMeetings(true);
            showMeeting(id, { keepScroll: true });
          } catch (e) { toast(t('common.error', { e }), 'err'); restore(); }
        };
        input.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; restore(); } });
        input.addEventListener('blur', commit);
      };

      const starred = new Set(moments.map(groupAt).filter(Boolean));
      groups.forEach((g, n) => {
        const seg = el('div', 'seg' + (starred.has(g) ? ' star' : ''));
        segEls.set(g, seg);
        if (n < 14) { seg.classList.add('reveal'); seg.style.setProperty('--i', String(n)); }
        seg.appendChild(el('div', 'ts', fmtClock(g.start_secs)));
        const sp = el('div', 'sp ' + spClass(g.speaker), speaker(g.speaker));
        sp.title = t('library.speaker.title', { name: speaker(g.speaker) });
        keyboardClick(sp, t('library.speaker.rename-aria', { name: speaker(g.speaker) }));
        sp.addEventListener('click', () => { if (!sp.querySelector('input')) renameSpeaker(sp, g.speaker); });
        seg.appendChild(sp);
        const tx = el('div', 'tx', g.text); tx.dataset.raw = g.text;
        seg.appendChild(tx);
        d.appendChild(seg);
      });
      if (!det.segments.length) d.appendChild(placeholder(t('library.no-transcript')));
      const note = el('p', 'filtered-note'); note.hidden = true; d.appendChild(note);
      // Busca semântica: o trecho que casou é a parada da rolagem.
      if (opts.at != null) { const g = groupAt(opts.at); jumpTo = g && segEls.get(g); }

      // ---- lógica da busca na reunião
      let marks = [], cur = -1, filtering = false;
      const setCur = (i) => {
        if (!marks.length) return;
        if (cur >= 0 && marks[cur]) marks[cur].classList.remove('cur');
        cur = (i + marks.length) % marks.length;
        marks[cur].classList.add('cur');
        marks[cur].scrollIntoView({ block: 'center', behavior: UI.reduce() ? 'auto' : 'smooth' });
        count.textContent = t('library.msearch.count', { cur: cur + 1, total: marks.length });
      };
      const apply = () => {
        const q = input.value.trim();
        meetingQuery[id] = q;
        box.classList.toggle('has-text', !!q);
        marks = []; cur = -1;
        let hitSegs = 0;
        d.querySelectorAll('.seg').forEach(seg => {
          const n = paint(seg.querySelector('.tx'), q);
          seg.classList.toggle('hit', n > 0);
          if (n) hitSegs++;
        });
        if (sumbox) { const n = paint(sumbox.querySelector('.summary'), q); sumbox.classList.toggle('hit', n > 0); }
        marks = [...d.querySelectorAll('mark')];
        d.classList.toggle('filtering', filtering && !!q);
        prev.disabled = next.disabled = marks.length < 2;
        filter.disabled = !q;
        count.classList.toggle('none', !!q && !marks.length);
        if (!q) { count.textContent = ''; note.hidden = true; return; }
        if (!marks.length) { count.textContent = t('library.msearch.none'); note.hidden = true; return; }
        setCur(0);
        note.hidden = !(filtering);
        note.textContent = t('library.msearch.note', { n: hitSegs, q });
      };
      let debounce = null;
      input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(apply, 150); });
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); setCur(cur + (ev.shiftKey ? -1 : 1)); }
        else if (ev.key === 'Escape') { ev.stopPropagation(); if (input.value) { input.value = ''; apply(); } else input.blur(); }
      });
      clear.addEventListener('click', () => { input.value = ''; apply(); input.focus(); });
      prev.addEventListener('click', () => setCur(cur - 1));
      next.addEventListener('click', () => setCur(cur + 1));
      filter.addEventListener('click', () => { filtering = !filtering; filter.setAttribute('aria-pressed', String(filtering)); apply(); });

      // Termo lembrado desta reunião; senão, o da busca geral — se ele estiver
      // no transcript, já aparece destacado (foi por ele que a reunião apareceu).
      // Na busca semântica a pergunta raramente aparece literal: não a pré-preenche.
      const initial = meetingQuery[id] !== undefined ? meetingQuery[id] : (opts.semantic ? '' : $('search').value.trim());
      if (initial) {
        input.value = initial;
        apply();
        if (!marks.length && meetingQuery[id] === undefined) { input.value = ''; apply(); }
      }
    });
    if (jumpTo) requestAnimationFrame(() => { jumpTo.scrollIntoView({ block: 'center', behavior: UI.reduce() ? 'auto' : 'smooth' }); jumpTo.classList.add('target'); });
    else if (keepScroll != null) d.scrollTop = keepScroll;
    else if (!(meetingQuery[id] || $('search').value.trim())) d.scrollTop = 0;
  }

  // ------------------------------------------------------------- ditados
  function dictationRow(r, q, extra) {
    const row = el('div', 'dict');
    row.appendChild(el('div', 'at', r.at));
    const tx = el('div', 'tx'); tx.dataset.raw = r.text; paint(tx, q);
    if (extra && extra.score != null) { const s = el('span', 'badge score', pct(extra.score)); s.title = t('library.score-title-dict'); tx.appendChild(s); }
    if (r.raw_text) { const c = el('span', 'chip chip-info', t('library.dict.ai')); c.title = t('library.dict.ai-title', { raw: r.raw_text }); tx.appendChild(c); }
    row.appendChild(tx);
    const bCopy = el('button', 'btn btn-sm btn-ghost', t('library.dict.copy'));
    bCopy.addEventListener('click', () => copyText(r.text, bCopy));
    const bDel = el('button', 'btn btn-sm btn-danger', '×'); bDel.title = t('library.dict.remove'); bDel.setAttribute('aria-label', t('library.dict.remove'));
    bDel.addEventListener('click', async () => {
      let sched;
      try { sched = await invoke('delete_dictation', { id: r.id }); }
      catch (e) { toast(t('common.error', { e }), 'err'); return; }
      $('list').dataset.sig = '';
      loadDictations(true);
      UI.undoable(t('library.dict.removed'), sched, (ok) => {
        if (!ok) { toast(t('library.dict.too-late'), 'err'); return; }
        $('list').dataset.sig = '';
        loadDictations(true);
      });
    });
    row.append(bCopy, bDel);
    return row;
  }

  async function loadDictations(silent = false) {
    const q = $('search').value;
    const list = $('list');
    if (!silent && !list.children.length) UI.skeleton(list, 6);
    let rows = [], hits = null;
    try {
      if (semanticActive()) {
        hits = await invoke('semantic_search', { kind: 'dictation', query: q, limit: 50 });
        rows = hits.map(h => ({ id: h.id, at: h.at, text: h.text, raw_text: null }));
      } else rows = await invoke('list_dictations', { query: q || null });
    }
    catch (e) { toast(t('common.error', { e }), 'err'); return; }
    $('count').textContent = rows.length ? t('library.count.dictations', { n: rows.length }) : '';
    const signature = (hits ? 'sem|' : 'lit|') + rows.map(r => r.id).join('|') + '|' + q;
    if (list.dataset.sig === signature) return;
    list.dataset.sig = signature;
    list.replaceChildren();
    if (!rows.length) { list.appendChild(placeholder(q ? (hits ? t('library.empty.semantic', { q }) : t('library.empty.dictations-query')) : t('library.empty.dictations'))); return; }
    list.appendChild(el('div', 'dict-note', t('library.dict.note')));
    rows.forEach((r, i) => list.appendChild(dictationRow(r, hits ? '' : q.trim(), hits ? hits[i] : null)));
    if (!silent) UI.stagger(list.children, 10);
  }

  // ----------------------------------------------------------------- ui
  function refresh(silent = false) { if (tab === 'meetings') loadMeetings(silent); else loadDictations(silent); }
  const tabsCtl = UI.tabs($('tabs'), (name) => setTab(name));
  // Placeholder da busca conforme a aba e o modo (texto ou sentido).
  const searchPlaceholder = () => (semantic ? t('library.search.semantic')
    : tab === 'meetings' ? t('library.top.buscar-titulo-resumo-transcript.placeholder') : t('library.search.dictations'));
  function setTab(name) {
    tab = name;
    $('main').classList.toggle('dictations', name === 'dictations');
    $('search').placeholder = searchPlaceholder();
    $('list').dataset.sig = '';
    $('list').replaceChildren();
    if (name === 'meetings') UI.swap($('detail'), () => $('detail').replaceChildren(placeholder(t('library.select'))));
    refresh();
  }
  let searchTimer = null;
  $('search').addEventListener('input', () => {
    $('searchbox').classList.toggle('has-text', !!$('search').value);
    clearTimeout(searchTimer); searchTimer = setTimeout(() => { $('list').dataset.sig = ''; refresh(true); }, semantic ? 450 : 200);
  });
  $('clear').addEventListener('click', () => { $('search').value = ''; $('searchbox').classList.remove('has-text'); $('list').dataset.sig = ''; refresh(true); $('search').focus(); });
  $('search').addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('search').value) { ev.stopPropagation(); $('clear').click(); } });
  $('semantic').addEventListener('click', () => {
    semantic = !semantic;
    $('semantic').setAttribute('aria-pressed', String(semantic));
    $('search').placeholder = searchPlaceholder();
    $('list').dataset.sig = '';
    refresh(true);
    $('search').focus();
  });
  async function checkSemantic() {
    try {
      const s = await invoke('embeddings_status');
      semanticAvailable = !!(s.configured && (s.key_present || s.provider === 'openai' || s.provider === 'ollama'));
    } catch (_) { semanticAvailable = false; }
    $('semantic').hidden = !semanticAvailable;
    if (!semanticAvailable && semantic) { semantic = false; $('semantic').setAttribute('aria-pressed', 'false'); }
  }
  $('openfolder').addEventListener('click', () => invoke('open_meetings_folder').catch(e => toast(t('common.error', { e }), 'err')));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
  document.addEventListener('keydown', (ev) => {
    const inField = ['INPUT', 'TEXTAREA'].includes(document.activeElement && document.activeElement.tagName);
    if (ev.key === 'Escape' && !inField) window.__TAURI__.window.getCurrentWindow().close();
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'f') {
      ev.preventDefault();
      // Com uma reunião aberta, Ctrl+F busca dentro dela; senão, na lista.
      const target = $('msearch') || $('search');
      target.focus(); target.select();
    }
  });

  // Aberta pelo Início com uma reunião escolhida: seleciona ao carregar e
  // sempre que o Início pedir de novo com esta janela já aberta.
  async function selectPending() {
    let id = null;
    try { id = await invoke('take_pending_meeting'); } catch (_) { return; }
    if (id == null) return;
    if (tab !== 'meetings') tabsCtl.select('meetings');
    selected = id;
    $('list').dataset.sig = '';
    await loadMeetings(true);
    showMeeting(id);
  }
  listen('isper-library-select', selectPending);
  // Reunião nova salva, ditado colado, índice atualizado etc. — a lista se mantém atual.
  listen('isper-status', () => { checkSemantic(); refresh(true); });
  listen('isper-state', (e) => { if (e.payload.state === 'done' && tab === 'dictations') setTimeout(() => refresh(true), 300); });

  document.addEventListener('isper-i18n', () => {
    $('search').placeholder = searchPlaceholder();
    $('list').dataset.sig = '';
    refresh(true);
    if (tab === 'meetings') {
      if (selected != null) showMeeting(selected, { keepScroll: true });
      else $('detail').replaceChildren(placeholder(t('library.select')));
    }
  });

  $('detail').replaceChildren(placeholder(t('library.select')));
  checkSemantic();
  refresh();
  selectPending();
</script>
</body>
