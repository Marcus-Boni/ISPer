<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ISPer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; user-select: none; cursor: default; }
  #pill {
    position: absolute; inset: 6px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
    background: rgba(22, 19, 17, .95);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 999px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #ece7e1;
  }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: #6f6862; flex: none; transition: background .2s; }
  #pill.recording #dot { background: #f07e72; animation: pulse 1.3s ease-in-out infinite; }
  #pill.transcribing #dot { background: #e8c15a; animation: pulse .5s ease-in-out infinite; }
  #pill.done #dot { background: #84c297; animation: none; }
  #pill.error #dot { background: #f07e72; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  canvas { flex: 1; height: 46px; min-width: 0; }
  #status {
    font-size: 13px; color: #a79e96; white-space: nowrap;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; flex: none;
  }
  #pill.done #status { color: #84c297; }
  #pill.error #status { color: #f07e72; }
</style>
</head>
<body>
<div id="pill">
  <div id="dot"></div>
  <canvas id="wave"></canvas>
  <div id="status">pronto</div>
</div>
<script>
  const { listen } = window.__TAURI__.event;
  const pill = document.getElementById('pill');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');

  const N = 48;
  let bars = new Array(N).fill(0);
  let state = 'idle';

  const truncate = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);

  const CLASS_MAP = {
    'recording-handsfree': 'recording handsfree',
    'meeting': 'recording meeting',
    'meeting-processing': 'transcribing',
    'meeting-done': 'done'
  };
  function setState(s, msg) {
    state = s;
    pill.className = CLASS_MAP[s] || s;
    if (s === 'recording') { bars.fill(0); statusEl.textContent = 'gravando… solte para colar'; blip(880, .05); }
    else if (s === 'recording-handsfree') statusEl.textContent = 'mãos-livres… 1 s de silêncio cola';
    else if (s === 'meeting') statusEl.textContent = 'gravando reunião — Eu + Participantes';
    else if (s === 'meeting-processing') statusEl.textContent = 'transcrevendo a reunião…';
    else if (s === 'meeting-done') { statusEl.textContent = 'reunião salva e aberta ✓'; blip(1320, .07); }
    else if (s === 'transcribing') statusEl.textContent = 'transcrevendo…';
    else if (s === 'done') { statusEl.textContent = msg ? '“' + truncate(msg, 40) + '”' : 'colado'; blip(1320, .07); }
    else if (s === 'error') statusEl.textContent = msg || 'erro';
    else statusEl.textContent = 'pronto';
  }

  listen('isper-state', e => setState(e.payload.state, e.payload.text || e.payload.message));
  listen('isper-level', e => {
    bars.push(Math.min(1, e.payload * 14));
    if (bars.length > N) bars.shift();
  });

  function sizeCanvas() {
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  addEventListener('resize', sizeCanvas);

  function draw() {
    if (!canvas.width) sizeCanvas();
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const bw = w / N;
    const rec = state.startsWith('recording');
    for (let i = 0; i < N; i++) {
      const v = rec ? bars[i] : bars[i] * 0.3;
      const bh = Math.max(3 * devicePixelRatio, v * h * 0.92);
      ctx.fillStyle = rec ? 'rgba(240,126,114,.95)' : 'rgba(167,158,150,.45)';
      ctx.beginPath();
      ctx.roundRect(i * bw + 1, (h - bh) / 2, Math.max(1, bw - 3), bh, 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // Sons discretos de início/fim — WebAudio, sem arquivos.
  let audioCtx;
  function blip(freq, dur) {
    try {
      audioCtx = audioCtx || new AudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) { /* autoplay bloqueado — sem som, sem drama */ }
  }
</script>
</body>
</html>
