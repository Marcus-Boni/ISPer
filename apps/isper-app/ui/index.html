<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ISPer</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* Indicador flutuante: janela transparente, sem foco, arrastável.
     Três modos, decididos pelo TAMANHO REAL da janela (fonte única):
     mini (< 300 px), normal, legendas (≥ 600 px).

     ORÇAMENTO DE LARGURA — a janela é fixa, sem rolagem e sem decoração:
     o que não couber vaza por cima da borda arredondada (era o que fazia os
     botões estourarem no mini em reunião). Cada modo é dimensionado pelo
     PIOR caso: reunião de 1 h+ ("1:02:05") com todos os botões visíveis.
       mini      12 folga + 20 padding + 10 ponto + 8 + 53 relógio + 8
                 + 66 (3 botões de 20 px, vãos de 3) = 177 → 192 px, que
                 deixa ~13 px de sobra para variação de fonte entre máquinas
       normal    fixos (ponto 10 + relógio 57 + 4 botões 100 + vãos 30)
                 saem de 418 → sobram ~221 px para a fala ao vivo
       legendas  a mesma conta em 718 → sobram ~521 px para a legenda
     Mexeu em botão, vão ou fonte do relógio? Refaça a conta aqui E nos
     OVERLAY_* de src-tauri/src/state.rs — os dois têm de andar juntos. */
  html, body { background: transparent !important; overflow: hidden; height: 100%; }
  * { user-select: none; }
  /* A sombra precisa caber DENTRO da janela (transparente, recorta tudo):
     margem de 8px embaixo para deslocamento 2px + desfoque 6px. */
  #pill {
    position: absolute; inset: 4px 6px 8px 6px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px;
    /* Cinto de segurança do orçamento acima: um texto maior que o previsto
       é cortado na borda em vez de desenhar fora da pílula. */
    overflow: hidden;
    background: rgba(22, 19, 17, .94);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: var(--r-pill);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .04);
    color: var(--ink); cursor: grab;
    transition: border-color var(--dur-3), box-shadow var(--dur-3);
  }
  #pill:active { cursor: grabbing; }
  #pill.recording { border-color: rgba(240, 126, 114, .38); box-shadow: 0 2px 6px rgba(0, 0, 0, .45), 0 0 0 1px rgba(240, 126, 114, .14); }
  #pill.transcribing { border-color: rgba(232, 193, 90, .3); }
  #pill.done { border-color: rgba(132, 194, 151, .4); }
  #pill.error { border-color: rgba(240, 126, 114, .55); }

  #dot { width: 10px; height: 10px; }
  #pill.recording #dot { background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  #pill.transcribing #dot { background: var(--warn); animation: pulse .6s ease-in-out infinite; }
  #pill.done #dot { background: var(--good); animation: ring-burst var(--dur-4) var(--ease-out) both; }
  #pill.error #dot { background: var(--accent); animation: none; }
  #pill.discarded #dot { background: var(--muted); animation: none; }
  #pill.discarded #status { color: var(--muted); }
  /* Chamada do Teams detectada: aviso passageiro, em âmbar. */
  #pill.call { border-color: rgba(232, 193, 90, .45); }
  #pill.call #dot { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  #pill.call #status { color: var(--warn); max-width: 70%; }

  /* `flex: 1` (base 0) e não `auto`: um <canvas> sem width tem 300px
     intrínsecos, que empurrariam o resto para fora. */
  canvas { flex: 1; height: 30px; min-width: 0; }
  /* Em reunião a fala ao vivo vale mais que o nível do microfone: a onda
     sobrava em 8 px — ilegível — e roubava metade do espaço do texto. */
  #pill.meeting canvas { display: none; }

  #status {
    font-size: 13px; color: var(--muted); white-space: nowrap;
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--dur-3);
  }
  /* Em reunião o status É a fala ao vivo: fica com toda a sobra da linha. */
  #pill.meeting #status { flex: 1 1 auto; }
  #status.flash { color: var(--warn); }
  #pill.done #status { color: var(--good); }
  #pill.error #status { color: var(--accent); }
  #timer {
    display: none; flex: none; font: 600 13px/1 var(--font-mono);
    color: var(--ink); letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  #pill.meeting #timer { display: block; }

  /* Controles: discretos em repouso, cheios no hover. Antes ficavam
     invisíveis (opacity 0) mas já ocupavam o lugar — espaço morto e
     ninguém descobria que a pílula tinha botões. */
  .ctl {
    display: flex; gap: 4px; flex: none; margin-left: auto;
    opacity: .45; transition: opacity var(--dur-2);
  }
  #pill:hover .ctl, #pill:focus-within .ctl { opacity: 1; }
  .ctl button {
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .06);
    color: var(--muted); font: 14px/1 var(--font-body); cursor: pointer;
    display: grid; place-items: center;
    transition: background var(--dur-2), color var(--dur-2), transform var(--dur-1);
  }
  /* Os botões são caixas de tamanho fixo (grid + place-items), então o SVG
     entra sem mexer na conta de largura da pílula. */
  .ctl button svg { width: 13px; height: 13px; }
  body.mini .ctl button svg { width: 12px; height: 12px; }
  .ctl button:hover { color: var(--ink); background: rgba(255, 255, 255, .14); }
  .ctl button:active { transform: scale(.88); }
  .ctl button:disabled { opacity: .5; }
  .ctl #mark { display: none; color: var(--warn); font-size: 13px; }
  #pill.meeting .ctl #mark { display: grid; }
  .ctl #copilot { display: none; color: var(--accent); font-size: 13px; font-weight: bold; }
  #pill.meeting .ctl #copilot { display: grid; }
  /* Legendas só fazem sentido em reunião — fora dela o CC era só ruído.
     Continua visível se o modo já estiver ligado, senão não teria volta. */
  .ctl #cap { display: none; font-size: 11px; }
  #pill.meeting .ctl #cap, body.captions .ctl #cap { display: grid; }
  .ctl #cap.on { color: var(--warn); border-color: rgba(232, 193, 90, .5); }

  /* Modo mini: ponto + cronômetro. Botões, vãos e fonte menores — é o modo
     mais apertado, e é onde o orçamento de largura não perdoa. */
  body.mini #pill { gap: 8px; padding: 0 8px 0 12px; }
  body.mini canvas, body.mini #captions { display: none; }
  body.mini #timer { font-size: 12px; letter-spacing: .02em; }
  /* Fora de reunião o mini era um ponto sozinho com 89 px de vazio até os
     botões; o status ocupa essa sobra (e encurta com "…" se não couber). */
  body.mini #status { font-size: 12px; }
  body.mini #pill.meeting #status { display: none; }
  body.mini .ctl { gap: 3px; }
  body.mini .ctl button { width: 20px; height: 20px; font-size: 13px; }
  body.mini .ctl #mark { font-size: 12px; }
  body.mini #pill.meeting .ctl #copilot { display: none; }
  body.mini #pill.meeting .ctl #cap { display: none; }

  /* Modo legendas: barra larga com as duas últimas falas da reunião. */
  #captions { display: none; flex: 1; min-width: 0; flex-direction: column; justify-content: center; gap: 3px; }
  body.captions #pill { border-radius: 20px; align-items: center; padding: 0 12px 0 18px; }
  body.captions canvas, body.captions #status { display: none; }
  body.captions #captions { display: flex; }
  .cap-line { font-size: 17px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cap-line.prev { font-size: 14px; color: var(--muted); -webkit-line-clamp: 1; }
  .cap-line .sp { font-weight: 600; color: var(--p1); margin-right: 6px; }
  .cap-line.eu .sp { color: var(--accent); }
  /* Legenda provisória (o bloco de 6 s ainda não fechou): a mesma fala, em
     tom apagado — a definitiva entra por cima quando o Whisper fecha o bloco.
     No modo normal quem avisa é o "…" no fim do status. */
  .cap-line.provisional { color: var(--muted); }
  .cap-line.provisional .sp { opacity: .65; }
  .cap-line.swap { animation: swap-in var(--dur-3) var(--ease-out) both; }
  .cap-hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="pill" data-tauri-drag-region role="status" aria-live="polite">
  <div id="dot" class="dot" data-tauri-drag-region></div>
  <canvas id="wave" data-tauri-drag-region></canvas>
  <div id="captions" data-tauri-drag-region>
    <div class="cap-line prev" id="cap-prev" data-tauri-drag-region></div>
    <div class="cap-line" id="cap-cur" data-tauri-drag-region><span class="cap-hint">legendas ao vivo — as falas aparecem aqui durante a reunião</span></div>
  </div>
  <div id="status" data-tauri-drag-region>pronto</div>
  <div id="timer" data-tauri-drag-region>00:00</div>
  <div class="ctl">
    <button id="mark" title="marcar este momento da reunião" aria-label="marcar momento" data-i18n-attr="title:overlay.top.marcar-este-momento-reuniao.title,aria-label:overlay.top.marcar-momento.aria"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 1.9 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.7l-3.8 2 .7-4.3-3.1-3 4.3-.6L8 1.9Z"/></svg></button>
    <button id="copilot" title="abrir ISPer Copilot (decisões ao vivo)" aria-label="abrir copilot" data-i18n-attr="title:overlay.top.abrir-isper-copilot-decisoes-vivo.title,aria-label:overlay.top.abrir-copilot.aria"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 9.4 5.9 13.5 7.3 9.4 8.7 8 12.8 6.6 8.7 2.5 7.3 6.6 5.9 8 1.8Z"/></svg></button>
    <button id="cap" title="legendas ao vivo (barra larga)" aria-label="alternar legendas ao vivo" data-i18n-attr="title:overlay.top.legendas-vivo-barra-larga.title,aria-label:overlay.top.alternar-legendas-vivo.aria">CC</button>
    <button id="mini" title="modo mini / normal" aria-label="alternar modo mini" data-i18n-attr="title:overlay.top.modo-mini-normal.title,aria-label:overlay.top.alternar-modo-mini.aria">–</button>
    <button id="hide" title="ocultar (volta no próximo ditado, pelo Início ou pela bandeja)" aria-label="ocultar indicador" data-i18n-attr="title:overlay.top.ocultar-volta-proximo-ditado-pelo.title,aria-label:overlay.top.ocultar-indicador.aria">×</button>
  </div>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/ui.js"></script>
<script>
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  const pill = $('pill');
  const statusEl = $('status');
  const canvas = $('wave');
  const ctx = canvas.getContext('2d');

  const N = 48;
  let bars = new Array(N).fill(0);   // alvo (nível do mic)
  let shown = new Array(N).fill(0);  // desenhado (interpola até o alvo)
  let state = 'idle';
  let waveRaf = 0;                   // laço da waveform (0 = parado)

  const truncate = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  const replay = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };
  const setStatus = (text) => { if (statusEl.textContent !== text) { statusEl.textContent = text; replay(statusEl, 'swap'); } };

  // Cronômetro da reunião (só a UI conta o tempo; começa no primeiro "meeting").
  let meetingStartedAt = null, timerHandle = null;
  function startTimer() {
    if (!meetingStartedAt) meetingStartedAt = Date.now();
    if (timerHandle) return;
    timerHandle = setInterval(() => { $('timer').textContent = UI.fmtClock((Date.now() - meetingStartedAt) / 1000); }, 500);
  }
  function stopTimer() {
    clearInterval(timerHandle); timerHandle = null; meetingStartedAt = null;
    $('timer').textContent = '00:00';
  }

  const CLASS_MAP = {
    'recording-handsfree': 'recording handsfree',
    'polishing': 'transcribing',
    'meeting': 'recording meeting',
    'meeting-processing': 'transcribing meeting',
    'meeting-diarize': 'transcribing meeting',
    'meeting-final': 'transcribing meeting',
    'meeting-summary': 'transcribing meeting',
    'meeting-done': 'done'
  };
  const RESTING = new Set(['idle', 'done', 'error', 'discarded']);
  let lastLive = null;   // última fala recebida (para voltar depois de um aviso)
  let shortcutLabel = '';  // atalho de ditado (o repouso mostra "pronto · <atalho>")
  const idleText = () =>
    (!document.body.classList.contains('mini') && shortcutLabel && !shortcutLabel.startsWith('(')
      ? t('overlay.ready-shortcut', { label: UI.keyLabel(shortcutLabel) }) : t('overlay.ready'));
  function setState(s, msg) {
    const wakingUp = RESTING.has(state) && !RESTING.has(s);
    state = s;
    pill.className = CLASS_MAP[s] || s;
    if (wakingUp) replay(pill, 'pop');          // o backend acabou de mostrar o indicador
    if (s === 'error') replay(pill, 'shake');
    if (s === 'meeting') startTimer();
    else if (s === 'meeting-done' || s === 'idle' || s === 'error' || s === 'discarded') { stopTimer(); lastLive = null; clearCaptions(); }

    if (s === 'recording') { bars.fill(0); setStatus(t('overlay.recording')); blip(880, .05); }
    else if (s === 'recording-handsfree') setStatus(t('overlay.handsfree'));
    else if (s === 'call') { setStatus(msg || t('overlay.call')); blip(990, .05); }
    else if (s === 'idle') setStatus(idleText());
    else if (s === 'meeting') setStatus(msg ? t('overlay.meeting-msg', { msg }) : t('overlay.meeting'));
    else if (s === 'meeting-processing') { setStatus(t('overlay.meeting-processing')); setCaptionHint(t('overlay.meeting-processing-hint')); }
    else if (s === 'meeting-diarize') setStatus(t('overlay.meeting-diarize'));
    else if (s === 'meeting-final') { setStatus(t('overlay.meeting-final')); setCaptionHint(t('overlay.meeting-final-hint')); }
    else if (s === 'meeting-summary') setStatus(t('overlay.meeting-summary'));
    else if (s === 'meeting-done') { setStatus(t('overlay.meeting-done')); setCaptionHint(t('overlay.meeting-done')); blip(1320, .07); }
    else if (s === 'transcribing') setStatus(t('overlay.transcribing'));
    else if (s === 'polishing') setStatus(t('overlay.polishing'));
    else if (s === 'done') { setStatus(msg ? '“' + truncate(msg, 40) + '”' : t('overlay.pasted')); blip(1320, .07); }
    else if (s === 'discarded') setStatus(t('overlay.discarded'));
    else if (s === 'error') setStatus(msg || t('overlay.error'));
    else setStatus(t('overlay.ready'));
    syncWave();   // a onda some em reunião: para o laço junto
  }

  // ---- legendas ao vivo
  function captionLine(node, seg) {
    node.replaceChildren();
    node.classList.toggle('eu', seg.speaker === 'Eu');
    node.classList.toggle('provisional', !!seg.provisional);
    const sp = document.createElement('span'); sp.className = 'sp'; sp.textContent = speakerName(seg.speaker) + ':';
    node.appendChild(sp);
    node.appendChild(document.createTextNode(seg.text));
  }
  function setCaptionHint(text) {
    const cur = $('cap-cur');
    cur.replaceChildren();
    const h = document.createElement('span'); h.className = 'cap-hint'; h.textContent = text;
    cur.appendChild(h);
    $('cap-prev').replaceChildren();
  }
  function clearCaptions() { setCaptionHint(t('overlay.captions-hint')); }
  // Rótulo de falante é dado (pt-BR no banco); só a exibição traduz.
  const speakerName = UI.speaker;
  let capCurSeg = null;
  function pushCaption(seg) {
    if (capCurSeg) captionLine($('cap-prev'), capCurSeg);
    captionLine($('cap-cur'), seg);
    replay($('cap-cur'), 'swap');
    capCurSeg = seg;
  }
  // Provisória: ocupa a linha atual sem virar "anterior" — a final substitui.
  function showProvisional(seg) {
    captionLine($('cap-cur'), seg);
  }

  listen('isper-state', e => setState(e.payload.state, e.payload.text || e.payload.message));
  // Transcrição ao vivo: a última fala no lugar do status (modo normal) e
  // nas duas linhas de legenda (modo legendas).
  listen('isper-live', e => {
    if (state !== 'meeting') return;
    const p = e.payload || {};
    const who = p.speaker === 'Eu' ? 'Eu: ' : '';
    const text = String(p.text || '').trim();
    if (p.provisional) {
      setStatus(who + truncate(text, 70) + '…');
      showProvisional({ speaker: p.speaker || 'Participantes', text, provisional: true });
      return;
    }
    lastLive = p;
    setStatus(who + truncate(text, 70));
    pushCaption({ speaker: p.speaker || 'Participantes', text });
  });
  // Momento marcado: confirma por 2 s e volta ao que estava.
  let flashTimer = null;
  listen('isper-moment', e => {
    const at = UI.fmtClock((e.payload && e.payload.at_secs) || 0);
    statusEl.classList.add('flash');
    setStatus(t('overlay.moment', { at }));
    $('cap-prev').replaceChildren();
    const cur = $('cap-cur'); cur.replaceChildren();
    const h = document.createElement('span'); h.className = 'cap-hint'; h.style.color = 'var(--warn)'; h.textContent = t('overlay.moment', { at });
    cur.appendChild(h);
    blip(1100, .05);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      statusEl.classList.remove('flash');
      if (state === 'meeting') {
        if (lastLive) { setStatus((lastLive.speaker === 'Eu' ? t('overlay.me-prefix') : '') + truncate(String(lastLive.text || '').trim(), 70)); pushCaption({ speaker: lastLive.speaker, text: String(lastLive.text || '').trim() }); }
        else { setStatus(t('overlay.meeting')); clearCaptions(); }
      }
    }, 2000);
  });
  listen('isper-level', e => {
    bars.push(Math.min(1, e.payload * 14));
    if (bars.length > N) bars.shift();
  });

  // Controles. O layout segue o TAMANHO REAL da janela (fonte única): os
  // botões só pedem ao backend para redimensionar; as classes vêm do resize.
  function applyMode() {
    const mini = innerWidth < 300, captions = innerWidth >= 600;
    document.body.classList.toggle('mini', mini);
    document.body.classList.toggle('captions', captions);
    $('mini').textContent = mini ? '+' : '–';
    $('mini').title = mini ? t('overlay.mini-back') : t('overlay.mini');
    $('cap').classList.toggle('on', captions);
    $('cap').title = captions ? t('overlay.captions-back') : t('overlay.captions');
    if (state === 'idle') setStatus(idleText());   // o atalho só cabe fora do mini
    syncWave();
  }
  addEventListener('resize', applyMode);
  // Idioma trocado: títulos dos botões e o status em repouso no idioma novo.
  document.addEventListener('isper-i18n', () => { applyMode(); if (state === 'idle') setStatus(idleText()); else if (state === 'meeting' && !lastLive) setStatus(t('overlay.meeting')); });
  applyMode();
  async function setMode(mode) {
    for (const id of ['mini', 'cap']) $(id).disabled = true;
    try { await invoke('overlay_set_mode', { mode }); } catch (_) {}
    for (const id of ['mini', 'cap']) $(id).disabled = false;
  }
  $('mini').addEventListener('click', (ev) => { ev.stopPropagation(); setMode(document.body.classList.contains('mini') ? 'normal' : 'mini'); });
  $('cap').addEventListener('click', (ev) => { ev.stopPropagation(); setMode(document.body.classList.contains('captions') ? 'normal' : 'captions'); });
  $('hide').addEventListener('click', async (ev) => {
    ev.stopPropagation();
    try { await invoke('overlay_hide'); } catch (_) {}
  });
  $('mark').addEventListener('click', async (ev) => {
    ev.stopPropagation();
    try { await invoke('mark_moment_cmd'); } catch (_) {}
  });
  $('copilot').addEventListener('click', async (ev) => {
    ev.stopPropagation();
    try { await invoke('open_copilot_window'); } catch (_) {}
  });

  // Posição lembrada: salva (com debounce) quando o usuário arrasta.
  let moveTimer = null;
  listen('tauri://move', (e) => {
    clearTimeout(moveTimer);
    const { x, y } = e.payload;
    moveTimer = setTimeout(() => { invoke('overlay_moved', { x, y }).catch(() => {}); }, 400);
  });

  // Reunião já em andamento quando a página carrega (ex.: indicador reaberto);
  // em repouso, mostra o atalho de ditado ao lado do "pronto".
  invoke('overlay_prefs').then(p => {
    shortcutLabel = p.shortcut || '';
    if (p.meeting_active) setState('meeting');
    else if (state === 'idle') setStatus(idleText());
  }).catch(() => {});

  function sizeCanvas() {
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  addEventListener('resize', sizeCanvas);

  // Waveform: barras interpolam até o nível alvo — movimento contínuo, sem
  // saltos. O laço só roda com a onda na tela: em reunião, no mini e nas
  // legendas ela está escondida, e um indicador que fica horas aberto não
  // pode gastar um quadro por frame desenhando coisa nenhuma.
  function syncWave() {
    const on = canvas.offsetParent !== null;   // null = display:none
    if (on && !waveRaf) waveRaf = requestAnimationFrame(draw);
    else if (!on && waveRaf) { cancelAnimationFrame(waveRaf); waveRaf = 0; }
  }
  function draw() {
    waveRaf = 0;
    if (canvas.clientWidth && (!canvas.width || canvas.width !== canvas.clientWidth * devicePixelRatio)) sizeCanvas();
    const w = canvas.width, h = canvas.height;
    if (w && h) {
      ctx.clearRect(0, 0, w, h);
      const bw = w / N;
      const rec = state.startsWith('recording');
      for (let i = 0; i < N; i++) {
        const target = rec ? bars[i] : bars[i] * 0.3;
        shown[i] += (target - shown[i]) * 0.35;
        const v = shown[i];
        const bh = Math.max(3 * devicePixelRatio, v * h * 0.92);
        const alpha = rec ? 0.55 + v * 0.45 : 0.45;
        ctx.fillStyle = rec ? 'rgba(240,126,114,' + alpha.toFixed(2) + ')' : 'rgba(167,158,150,' + alpha + ')';
        ctx.beginPath();
        ctx.roundRect(i * bw + 1, (h - bh) / 2, Math.max(1, bw - 3), bh, 2);
        ctx.fill();
      }
    }
    waveRaf = requestAnimationFrame(draw);
  }
  syncWave();

  // Sons discretos de início/fim — WebAudio, sem arquivos.
  let audioCtx;
  function blip(freq, dur) {
    try {
      audioCtx = audioCtx || new AudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) { /* autoplay bloqueado — sem som, sem drama */ }
  }
</script>
