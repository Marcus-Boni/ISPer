org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ABIs compiladas pelo Rust: arm64-v8a para celulares de verdade, x86_64
# para o emulador. `-Pisper.abis=arm64-v8a` acelera um build só para o celular.
isper.abis=arm64-v8a,x86_64
