[workspace]
resolver = "2"
members = [
    "crates/isper-core",
    "crates/isper-assist",
    "crates/isper-llm",
    "crates/isper-agent",
    "crates/isper-mcp",
    "crates/isper-models",
    "crates/isper-diarize",
    "crates/isper-sync",
    "crates/isper-cli",
    "crates/isper-mobile",
    "crates/uniffi-bindgen",
    "apps/isper-app/src-tauri",
]

# Lints compartilhados por todos os crates (`[lints] workspace = true` em cada
# Cargo.toml). O CI roda `cargo clippy -- -D warnings`: aviso aqui = erro lá.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Rastros de depuração e pendências não podem chegar ao main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `unwrap()` só em testes (clippy.toml): em produção, `expect` com o motivo,
# `?`, ou um fallback — um pânico no app derruba a bandeja e a reunião.
unwrap_used = "warn"

# Perfil de release com otimização máxima — inferência de áudio é CPU-intensiva.
[profile.release]
lto = "thin"
codegen-units = 1

# No modo debug (`cargo test`, `cargo clippy`, `cargo build`), as dependências
# de terceiros compilam sem informação de depuração: é ela que enche o
# `target/debug` (os .pdb e o debuginfo de centenas de crates), e quase nunca
# se depura dentro delas. O código do workspace continua com a depuração
# completa; um backtrace que passa por uma dependência só perde a linha dela.
[profile.dev.package."*"]
debug = false
