# CI do ISPer: formatação, testes e checagem do app — no Windows, sem CUDA.
#
# O runner windows-latest já traz MSVC, CMake e LLVM (libclang p/ bindgen);
# o whisper.cpp é compilado em CPU. O app não é ligado: o clippy (que inclui o
# `cargo check`) roda com `--no-default-features` (sem CUDA) e com DLLs vazias
# no lugar dos `bundle.resources` (sherpa-onnx e runtime do Visual C++),
# porque o build script do Tauri exige que eles existam. Nada aqui baixa
# modelos.
# `workflow_call`: o release.yml roda esta mesma bateria sobre a tag.
#
# O `isper-diarize` não tem testes próprios e não entra sozinho no `cargo
# test`; ele é compilado e ligado pelo binário de teste do app, com as import
# libs do sherpa-onnx pré-compilado que o crate `sherpa-onnx` baixa durante o
# build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# O grupo inclui o nome do workflow chamador: quando o release.yml reutiliza este
# arquivo (workflow_call), github.workflow e "Release", e o run do push em main
# nao e cancelado pelo run da validacao da tag (ambos apontam para o mesmo ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt · test · check (Windows, CPU)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Toolchain fixo em rust-toolchain.toml (fonte única — a mesma versão de
      # quem desenvolve): o canal lido de lá é o que a action instala.
      - name: Canal do Rust (rust-toolchain.toml)
        id: toolchain
        shell: pwsh
        run: |
          $m = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          if (-not $m) { throw "rust-toolchain.toml sem 'channel'" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$($m.Matches[0].Groups[1].Value)"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # v3: o pré-compilado do sherpa-onnx passou a morar dentro do target/.
          key: v3
          cache-directories: target/sherpa-onnx-prebuilt
          # O whisper.cpp compilado (whisper-rs-sys) é o que mais pesa.
          cache-on-failure: true

      # O crate sherpa-onnx baixa o pré-compilado (DLLs e import libs) para
      # target/sherpa-onnx-prebuilt e grava esse caminho na saída do build
      # script. Se o cache trouxer a saída do build script mas não as
      # bibliotecas (a pasta pode voltar vazia), o link falha com LNK1181: sem
      # a biblioteca, a saída antiga sai e o build script roda de novo,
      # baixando tudo. A conferência é pelo arquivo, não pela pasta.
      - name: sherpa-onnx pré-compilado presente
        shell: pwsh
        run: |
          $lib = @(Get-ChildItem target/sherpa-onnx-prebuilt -Recurse -File -Filter 'sherpa-onnx-c-api*' -ErrorAction SilentlyContinue)
          if ($lib.Count -eq 0) {
            "pré-compilado do sherpa-onnx ausente: o build script vai rodar e baixar de novo"
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt -ErrorAction SilentlyContinue
            Get-ChildItem target -Recurse -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Formatação
        run: cargo fmt --all -- --check

      # Antes dos testes: o build script do Tauri (binário de teste do app)
      # exige que os bundle.resources existam.
      - name: Recursos de mentira (o bundler exige que os bundle.resources existam)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/sherpa | Out-Null
          foreach ($dll in @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/sherpa/$dll" | Out-Null
          }
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/vcredist | Out-Null
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/vcredist/$dll" | Out-Null
          }

      # Todos os crates com testes, inclusive o app e a CLI (sem CUDA): a
      # lógica pura extraída deles — config, pastas, atalhos, posição do
      # indicador, definição da CLI — roda aqui, além dos testes golden e de
      # propriedade do núcleo. O `isper-sync` sobe o protocolo de ponta a
      # ponta pelo loopback (iroh de verdade), e o `isper-mobile` testa o
      # gravador e a rodada de sincronia do celular.
      - name: Testes (núcleo, IA, modelos, sincronia, celular, app e CLI)
        run: cargo test --release --no-default-features -p isper-core -p isper-llm -p isper-models -p isper-sync -p isper-mobile -p isper-cli -p isper-app

      # Clippy é `cargo check` + lints em TODOS os alvos (testes e o loopdump
      # inclusive); `--release` reaproveita o whisper.cpp que o `cargo test`
      # acima já compilou.
      - name: Clippy (avisos são erros) — app e CLI sem CUDA
        run: cargo clippy --workspace --all-targets --release --no-default-features -- -D warnings

      # A referência da API do motor: todo item público documentado (o
      # `#![deny(missing_docs)]` do isper-core) e nenhum link interno quebrado.
      # `--release` pelo mesmo motivo do clippy: reaproveita o whisper.cpp.
      - name: Documentação da API do núcleo (avisos são erros)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --release --no-default-features -p isper-core --no-deps

  # Cadeia de suprimentos: vulnerabilidades (RustSec), licenças fora da lista
  # permitida, versões duplicadas e origens desconhecidas — regras em deny.toml.
  deny:
    name: cargo deny (vulnerabilidades · licenças · origens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: stable

  # Nenhum segredo (chave de API, token) pode entrar no histórico do repositório.
  secrets:
    name: gitleaks (segredos no histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
