# CI do ISPer: formatação, testes e checagem do app — no Windows, sem CUDA.
#
# O runner windows-latest já traz MSVC, CMake e LLVM (libclang p/ bindgen);
# o whisper.cpp é compilado em CPU. O app é só checado (`cargo check`) com
# `--no-default-features` (sem CUDA) e com DLLs vazias no lugar dos
# `bundle.resources` (sherpa-onnx e runtime do Visual C++), porque o build
# script do Tauri exige que eles existam. Nada aqui baixa modelos.
# `workflow_call`: o release.yml roda esta mesma bateria sobre a tag.
#
# O `isper-diarize` não entra no `cargo test`: ele não tem testes, e ligar o
# binário de teste exige as import libs do sherpa-onnx pré-compilado
# (`cargs.lib`/`sherpa-onnx-c-api.lib`), que o runner não tinha (LNK1181).
# O `cargo check` do app (que depende dele) compila o crate sem ligar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# O grupo inclui o nome do workflow chamador: quando o release.yml reutiliza este
# arquivo (workflow_call), github.workflow e "Release", e o run do push em main
# nao e cancelado pelo run da validacao da tag (ambos apontam para o mesmo ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt · test · check (Windows, CPU)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # O whisper.cpp compilado (whisper-rs-sys) é o que mais pesa.
          cache-on-failure: true

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Testes (núcleo, IA, modelos)
        run: cargo test --release -p isper-core -p isper-llm -p isper-models

      - name: Recursos de mentira (o bundler exige que os bundle.resources existam)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/sherpa | Out-Null
          foreach ($dll in @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'cargs.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/sherpa/$dll" | Out-Null
          }
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/vcredist | Out-Null
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/vcredist/$dll" | Out-Null
          }

      - name: Checagem do app (sem CUDA) e da CLI
        run: cargo check --release -p isper-app -p isper-cli --no-default-features
