# Ponta a ponta noturno: compila o app (CPU, sem CUDA) num runner Windows e
# roda o smoke real — o exe sobe com WebView2, abre Início, Biblioteca,
# Configurações e o indicador, alterna modos e consulta o atualizador, tudo
# pelo Chrome DevTools Protocol (tools/e2e). O runner não tem placa de som
# nem GPU: o teste de reunião (meeting.ps1, que toca áudio e transcreve) e o
# soak (soak.ps1) continuam locais; aqui a pergunta é "o app instalado abre e
# as janelas funcionam depois do que entrou hoje?".
#
# Não é check obrigatório de PR: roda de madrugada (03:00 em Brasília) e à mão.
name: E2E noturno

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: smoke do app real (Windows, CPU, sem áudio)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Canal do Rust (rust-toolchain.toml)
        id: toolchain
        shell: pwsh
        run: |
          $m = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
          if (-not $m) { throw "rust-toolchain.toml sem 'channel'" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$($m.Matches[0].Groups[1].Value)"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Ver o comentário equivalente em ci.yml: a pasta do sherpa-onnx
      # pré-compilado precisa viajar no cache junto com o target/.
      - name: Pasta do sherpa-onnx pré-compilado
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SHERPA_CACHE=$env:LOCALAPPDATA\sherpa-rs"

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-nightly-v2
          cache-directories: ${{ env.SHERPA_CACHE }}
          cache-on-failure: true

      # O cdp.mjs usa o WebSocket global do Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O build script do Tauri exige os bundle.resources; as DLLs reais do
      # sherpa-onnx que o exe carrega vêm do pré-compilado que o sherpa-rs
      # baixa e copia para target/release durante o build.
      - name: Recursos de mentira (bundle.resources)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/sherpa | Out-Null
          foreach ($dll in @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'cargs.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/sherpa/$dll" | Out-Null
          }
          New-Item -ItemType Directory -Force apps/isper-app/src-tauri/resources/vcredist | Out-Null
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            New-Item -ItemType File -Force "apps/isper-app/src-tauri/resources/vcredist/$dll" | Out-Null
          }

      - name: Compila o app (CPU)
        run: cargo build --release --no-default-features -p isper-app

      # O tauri-build copia os bundle.resources — aqui, DLLs VAZIAS — para
      # target/release, por cima das DLLs reais que o sherpa-rs-sys tinha posto
      # lá. Um exe ao lado de uma sherpa-onnx-c-api.dll de 0 bytes nem abre
      # (foi assim que a primeira execução deste workflow falhou). As vazias
      # saem; as do sherpa-onnx voltam do pré-compilado baixado; o runtime do
      # VC vem do próprio Windows do runner.
      - name: DLLs reais ao lado do exe
        shell: pwsh
        run: |
          Get-ChildItem target\release\*.dll | Where-Object { $_.Length -eq 0 } | ForEach-Object {
            "removendo DLL vazia: $($_.Name)"
            Remove-Item $_.FullName -Force
          }
          $libs = @(Get-ChildItem "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Filter *.dll -ErrorAction SilentlyContinue)
          if ($libs.Count -eq 0) { throw "DLLs do sherpa-onnx nao encontradas em $env:LOCALAPPDATA\sherpa-rs" }
          $libs | Copy-Item -Destination target\release -Force
          Get-ChildItem target\release\*.dll | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output

      # Antes do smoke: o exe abre e fica vivo? Se morrer, o código de saída e o
      # que ele escreveu (o tracing também vai para o stdout) aparecem aqui — o
      # smoke sozinho só diria "app não abriu".
      - name: Sanidade — o exe abre?
        shell: pwsh
        run: |
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 Runtime: $(if ($wv) { $wv.pv } else { 'NAO ENCONTRADO' })"
          $p = Start-Process .\target\release\isper-app.exe -WorkingDirectory .\target\release -PassThru -RedirectStandardOutput sanity-out.txt -RedirectStandardError sanity-err.txt
          Start-Sleep -Seconds 12
          # Decidido ANTES de encerrar: depois do Stop-Process o codigo de saida e o do kill.
          $alive = -not $p.HasExited
          if ($alive) {
            "o exe esta vivo (PID $($p.Id)); janela: $((Get-Process -Id $p.Id).MainWindowTitle)"
            Stop-Process -Id $p.Id -Force
          } else {
            "o exe SAIU sozinho com codigo $($p.ExitCode) (0x$('{0:X8}' -f $p.ExitCode))"
          }
          Start-Sleep -Seconds 2
          "--- stdout ---"; Get-Content sanity-out.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          "--- stderr ---"; Get-Content sanity-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (-not $alive) { throw "o app nao fica aberto no runner" }

      - name: Smoke ponta a ponta (CDP)
        shell: pwsh
        run: .\tools\e2e\smoke.ps1 -Exe .\target\release\isper-app.exe

      # Quando o smoke falha, o que interessa e o que o runner tinha na hora:
      # processos do app e do WebView2 (com a linha de comando), quem escuta a
      # porta CDP e o fim do log do ISPer.
      - name: Diagnostico da falha
        if: failure()
        shell: pwsh
        run: |
          "--- processos ---"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'isper-app.exe', 'msedgewebview2.exe' } |
            ForEach-Object { "$($_.Name) pid=$($_.ProcessId) ppid=$($_.ParentProcessId) $([string]$_.CommandLine)" }
          "--- porta 9223 ---"
          netstat -ano | Select-String ':9223' | ForEach-Object { $_.Line.Trim() }
          "--- IPv6 / localhost ---"
          foreach ($u in 'http://localhost:9223/json', 'http://[::1]:9223/json') {
            try { $r = Invoke-RestMethod $u -TimeoutSec 3; "$u -> $(@($r).Count) alvos" } catch { "$u -> $($_.Exception.Message)" }
          }
          "--- log do ISPer ---"
          Get-ChildItem "$env:LOCALAPPDATA\com.isper.desktop\logs" -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name) =="; Get-Content $_.FullName -Tail 80 }

      # O contexto `env` do Actions não enxerga as variáveis da máquina
      # (LOCALAPPDATA): o caminho do log é exportado pelo shell.
      - name: Encerra o app e localiza o log
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name isper-app -Force -ErrorAction SilentlyContinue
          Add-Content -Path $env:GITHUB_ENV -Value "ISPER_LOGS=$env:LOCALAPPDATA\com.isper.desktop\logs"

      - name: Log do ISPer (para investigar uma falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isper-logs
          path: ${{ env.ISPER_LOGS }}
          # Sem log = o app nem chegou ao main (DLL faltando): vale um aviso.
          if-no-files-found: warn
          retention-days: 14
