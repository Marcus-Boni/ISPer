name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uma release não dispara mais este workflow. O deploy exige push na main ou
# disparo manual, então o gatilho de release só gastava dois minutos validando
# e construindo para então não publicar nada. Quem reage a uma release agora é
# o portal-release-sync.yml, que abre o PR com o snapshot novo — e é o merge
# desse PR, sendo um push na main, que publica.

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.3.4"
  WEBSITE_DIR: website
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'isper' }}

jobs:
  validate:
    name: lint, typecheck and content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content contract
        run: node scripts/validate-content.mjs

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Puro e sem rede: o parser das notas da release lê texto livre escrito
      # por gente, e é a peça do sync que pode degradar em silêncio.
      - name: Testes dos scripts
        run: node --test "scripts/**/*.test.mjs"

  build:
    name: static export
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare deterministic content
        run: node scripts/prepare-content.mjs

      - name: Build static site
        run: pnpm exec next build

      - name: Build local search index
        run: pnpm exec pagefind --site out

      - name: Verify static export
        run: node scripts/verify-export.mjs

      - name: Check internal links and anchors
        run: node scripts/check-links.mjs

      - name: Check static budgets
        run: node scripts/check-budgets.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: website-out
          path: website/out
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    # Sempre a partir da main, e também pelo disparo manual: um deploy que
    # falhou por causa externa, ou um secret rotacionado, não deveria exigir
    # um commit vazio só para republicar o que já está na main.
    if: >
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install deployment tools
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: website-out
          path: website/out

      - name: Skip deploy when Cloudflare secrets are absent
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare Pages deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy tested artifact
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          pnpm exec wrangler pages deploy out
          --project-name "${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}"
          --branch main
          --commit-hash "${{ github.sha }}"
