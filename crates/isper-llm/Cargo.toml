[package]
name = "isper-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
toml = "0.8"
tracing = "0.1"
# Pastas conhecidas do Windows — ver config_path().
dirs = "5"

[lints]
workspace = true
