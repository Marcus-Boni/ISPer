[package]
name = "isper-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# HTTP sincrono (ureq 3): rustls + gzip + json, sem cookies/charset que a API nao usa.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
toml = "1"
tracing = "0.1"
# Pastas conhecidas do Windows — ver config_path().
dirs = "6"

[lints]
workspace = true
