[package]
name = "isper-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Aceleração NVIDIA: `cargo build --features cuda` (requer CUDA Toolkit)
cuda = ["whisper-rs/cuda"]

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
crc32fast = "1"
hound = "3.5.1"
rubato = "0.16"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tracing = "0.1.44"
wasapi = "0.24.0"
# `tracing_backend`: os logs do whisper.cpp/ggml (inclusive uma linha por
# segmento de VAD) saem do stderr e entram no `tracing`, sob o alvo
# `whisper_rs::*` — filtráveis como qualquer outro log do app.
whisper-rs = { version = "0.16.0", features = ["tracing_backend"] }
sysinfo = "0.39"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11"
# O teste de integração do pipeline resolve o modelo instalado do mesmo jeito
# que o app — sem duplicar a busca de pastas conhecidas do Windows.
isper-models = { version = "0.1.0", path = "../isper-models" }
