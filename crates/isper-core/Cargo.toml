[package]
name = "isper-core"
version = "0.1.0"
edition = "2024"

[features]
# Aceleração NVIDIA: `cargo build --features cuda` (requer CUDA Toolkit)
cuda = ["whisper-rs/cuda"]

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
hound = "3.5.1"
rubato = "0.16"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
tracing = "0.1.44"
wasapi = "0.24.0"
whisper-rs = "0.16.0"
