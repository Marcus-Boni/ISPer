[package]
name = "isper-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Fachada do núcleo do ISPer para o celular (UniFFI: Kotlin agora, Swift depois)"

[lib]
# cdylib: a libisper_mobile.so que o app Android carrega (e a .dll no PC,
# que só serve para os testes). lib: para os testes e para o gerador de
# bindings (`crates/uniffi-bindgen`) ler os metadados.
crate-type = ["cdylib", "lib"]

[dependencies]
isper-core = { path = "../isper-core" }
isper-diarize = { path = "../isper-diarize" }
isper-models = { path = "../isper-models" }
# Fase 9.3: mandar as gravações ao PC e trazer a ata (ADR 0017).
isper-sync = { path = "../isper-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"
# O log do núcleo (e do iroh) num arquivo do app: o logcat não vê o `tracing`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
# Versão fixa: o UniFFI ainda é 0.x e muda o formato dos bindings entre
# versões menores. Subir de versão é um PR próprio (ADR 0014).
uniffi = "=0.32.2"

[lints]
workspace = true
