[package]
name = "isper-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cliente MCP do ISPer e o conector do OptTime (Fase 10, ADR 0022)"
publish = false

[dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# As datas da agenda (ISO 8601 com offset) para casar evento e gravação.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
thiserror = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1.25", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
