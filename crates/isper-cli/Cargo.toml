[package]
name = "isper-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# O pacote tem dois binários (isper-cli e loopdump) — sem isto, `cargo run`
# não sabe qual executar.
default-run = "isper-cli"

[features]
# CUDA ligado por padrão (esta máquina tem RTX 4050). Sem GPU NVIDIA:
# `cargo build --no-default-features`.
default = ["cuda"]
cuda = ["isper-core/cuda"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
hound = "3.5.1"
isper-core = { version = "0.1.0", path = "../isper-core" }
isper-llm = { version = "0.1.0", path = "../isper-llm" }
isper-models = { version = "0.1.0", path = "../isper-models" }
isper-diarize = { version = "0.1.0", path = "../isper-diarize" }
isper-sync = { version = "0.1.0", path = "../isper-sync" }
# O QR do `receber`, desenhado no terminal.
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
