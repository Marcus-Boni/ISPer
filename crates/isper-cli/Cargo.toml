[package]
name = "isper-cli"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["isper-core/cuda"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
hound = "3.5.1"
isper-core = { version = "0.1.0", path = "../isper-core" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
