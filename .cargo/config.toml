# Variáveis de ambiente aplicadas pelo cargo aos build scripts — assim
# `cargo build` de qualquer shell compila o whisper.cpp otimizado, sem ter
# que exportar nada na mão (ver README → Build).
#
# O build.rs do whisper-rs-sys repassa qualquer GGML_* / CMAKE_* ao CMake.
[env]
# Conjunto de instruções FIXO (AVX2/FMA/F16C/BMI2 — o que o README promete: "qualquer
# PC x64 com AVX2"). GGML_NATIVE fica OFF de propósito: com ele ligado (o padrão do
# ggml) o CMake detecta a CPU de QUEM COMPILA e, num runner do GitHub com AVX-512,
# emitia /arch:AVX512 — o instalador da 0.17.0 morria com instrução ilegal
# (0xc000001d) na primeira inferência num Ryzen 7 7735HS, que não tem AVX-512.
GGML_NATIVE = "OFF"
GGML_AVX512 = "OFF"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
# O crate `cmake` engole os flags de otimização Release no MSVC (whisper.cpp
# ficava ~13x mais lento) — forçamos aqui.
CMAKE_C_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
# Só a arquitetura da RTX 4050 (Ada, compute 8.9): corta MUITO o tempo de
# compilação dos kernels CUDA.
CMAKE_CUDA_ARCHITECTURES = "89"
